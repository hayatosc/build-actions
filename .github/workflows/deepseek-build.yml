    - name: Archive Windows package
      if: runner.os == 'Windows'
      shell: pwsh
      run: "@'\nimport pathlib,hashlib,json,tarfile,zipfile,os\nr=pathlib.Path('delivery'); entries={str(p.relative_to(r)).replace('\\\
        \\','/'):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()};(r/'SHA256SUMS.txt').write_text(''.join(v+'\
        \  '+k+'\\n' for k,v in entries.items()))\nname='deepseek-harness-0.2.1-rc.2-'+os.environ['PACKAGE_PLATFORM']+'-web';pathlib.Path('release-assets').mkdir(exist_ok=True)\n\
        if os.name=='nt':\n out=pathlib.Path('release-assets')/(name+'.zip')\n with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED)\
        \ as z:\n  for p in r.rglob('*'):\n   if p.is_file():z.write(p,str(p.relative_to(r)))\n with zipfile.ZipFile(out)\
        \ as z:assert z.testzip() is None\nelse:\n out=pathlib.Path('release-assets')/(name+'.tar.gz')\n with tarfile.open(out,'w:gz')\
        \ as t:t.add(r,arcname=name)\n with tarfile.open(out,'r:gz') as t:assert len(t.getmembers())>3\nh=hashlib.sha256(out.read_bytes()).hexdigest();out.with_name(out.name+'.sha256').write_text(h+'\
        \  '+out.name+'\\n');print(out.name,h)\n'@ | Set-Content package.py -Encoding utf8\npython package.py\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'Python step failed' }"

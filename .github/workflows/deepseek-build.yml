    - uses: actions/upload-artifact@v7.0.1
      with:
        name: deepseek-${{ matrix.platform }}
        path: release-assets/*
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
    - name: Retain safe failure phase
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: diagnostic-${{ matrix.platform }}
        path: 'startup-diagnostic.json

          deployment-repair.json'
        if-no-files-found: ignore
        retention-days: 3
    - name: Retain carrier differential evidence
      if: always() && matrix.platform == 'linux-x64'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: carrier-differential-${{ matrix.platform }}
        path: 'carrier-evidence/

          sdk-diagnostic.json

          startup-diagnostic.json'
        retention-days: 3
        if-no-files-found: ignore
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        pattern: deepseek-*
        path: release-assets
        merge-multiple: true
    - name: Verify archives and publish versioned release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: 'set -euo pipefail

        cd release-assets

        for checksum in *.sha256; do sha256sum -c "$checksum"; done

        test "$(find . -maxdepth 1 -name ''*.sha256'' | wc -l)" -eq 5

        tag="deepseek-0.2.1-rc.2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        printf ''%s

        '' ''Unofficial native Web UI packages, source bb8e649df3c976c9cd965037593f353009992ae3.'' ''Any downstream runtime
        dependency closure correction is documented in deployment-repair.json and deployment-repair.patch. Windows direct
        native EXE entry and native browser helper changes are documented in windows-entry.patch. Extract all companions;
        no CMD launcher. Windows/Linux/macOS; see verification.json inside each archive for exact tests. Linux ARM64: native
        HTTP/assets checks, no Chrome UI check. No model credentials or live model tests. Unsigned packages; do not disable
        OS security protections.'' > "$RUNNER_TEMP/release-notes.txt"

        gh release create "$tag" ./* --repo "$GH_REPO" --target "$GITHUB_SHA" --title "DeepSeek Harness 0.2.1-rc.2 native
        Web UI" --notes-file "$RUNNER_TEMP/release-notes.txt" --prerelease

        gh release view "$tag" --repo "$GH_REPO" --json url,assets > "$RUNNER_TEMP/published-release.json"

        python -c ''import json,os;x=json.load(open(os.environ["RUNNER_TEMP"]+"/published-release.json"));assert len(x["assets"])==10;assert
        all(a["size"]>0 for a in x["assets"]);print(x["url"])'' '

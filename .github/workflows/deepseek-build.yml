        \ e;}finally{if(browser)await browser.close();if(api)await api.dispose();if(child.exitCode===null){try{if(windows)execFileSync('taskkill',['/PID',String(child.pid),'/T','/F'],{stdio:'ignore'});else\
        \ process.kill(-child.pid,'SIGTERM')}catch{}}output='';for(let i=0;i<150&&child.exitCode===null;i++)await new Promise(r=>setTimeout(r,100));if(child.exitCode===null){try{if(!windows)process.kill(-child.pid,'SIGKILL')}catch{}await\
        \ new Promise(r=>setTimeout(r,1000));}}\n}\nfs.writeFileSync(path.join(report,'verification.json'),JSON.stringify({source:process.env.SOURCE_SHA,platform,host:process.platform,arch:process.arch,checkedAt:new\
        \ Date().toISOString(),checks:evidence,modelAuthentication:'not tested; no credentials provided'},null,2));\n})().catch(e=>{const\
        \ diagnostic={result:'failed',phase,trial,errorClass:e?.name||'Error',diagnostics,rawOutput:'withheld'};fs.writeFileSync('startup-diagnostic.json',JSON.stringify(diagnostic,null,2));console.error(JSON.stringify(diagnostic));process.exitCode=1});\n\
        JS\nnode harness-smoke.cjs"
    - name: Diagnose official deployed Node carrier after SDK UI failure

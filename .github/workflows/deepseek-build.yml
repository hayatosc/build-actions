name: Build DeepSeek all native OS packages
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/deepseek-build.yml
    - deepseek-build-request.txt
permissions:
  contents: read
concurrency:
  group: deepseek-allos
  cancel-in-progress: false
env:
  SOURCE_SHA: bb8e649df3c976c9cd965037593f353009992ae3
  DSH_TELEMETRY_DISABLED: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: node24-linux-x64
          platform: linux-x64
          runner: ubuntu-24.04
        - target: node24-linux-arm64
          platform: linux-arm64
          runner: ubuntu-24.04-arm
        - target: node24-macos-arm64
          platform: macos-arm64
          runner: macos-latest
        - target: node24-macos-x64
          platform: macos-x64
          runner: macos-15-intel
        - target: node24-win-x64
          platform: win-x64
          runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PACKAGE_PLATFORM: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        repository: shiguredo/deepseek-harness
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.19.0
    - uses: actions/setup-python@v6.3.0
      with:
        python-version: '3.12'
    - uses: pnpm/action-setup@v5.0.0
      with:
        version: 11.28.5
    - name: Check immutable source and native symlink support
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        node -e "const fs=require(''fs''),p=require(''path''),r=p.join(process.env.RUNNER_TEMP,''harness-symlink-check'');fs.mkdirSync(r,{recursive:true});fs.writeFileSync(p.join(r,''source''),''test'');fs.symlinkSync(p.join(r,''source''),p.join(r,''link''),''file'');if(fs.readFileSync(p.join(r,''link''),''utf8'')!==''test'')throw Error(''Symlink support absent; no security settings will be changed'')"'
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Build official native runtime
      shell: bash
      env:
        DSH_BUILD_CLIENT_PROFILE: official
      run: pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets=${{ matrix.target }}
    - name: Stage Windows package
      if: runner.os == 'Windows'
      shell: pwsh
      run: "@'\nimport os,pathlib,shutil,json,hashlib,tarfile,zipfile\np=os.environ['PACKAGE_PLATFORM']; win=p.startswith('win-'); root=pathlib.Path('delivery');root.mkdir();src=pathlib.Path('dist-exe');exe='deepseek-harness-sdk-runtime-'+p+('.exe' if win else '')\nfor name in [exe,'deepseek-harness-sdk-runtime-'+p+('-rg.exe' if win else '-rg')]:shutil.copy2(src/name,root/name)\nif p.startswith('macos-'):shutil.copy2(src/(exe+'-spawn-helper'),root/(exe+'-spawn-helper'))\nshutil.copytree(src/p,root/p);shutil.copy2('LICENSE',root/'LICENSE.txt')\nif win:\n (root/'Start-DeepSeek.cmd').write_text('@echo off\\ncd /d \"%~dp0\"\\necho Starting DeepSeek Harness Web UI. Keep this window open.\\n\"%~dp0'+exe+'\" web\\nif errorlevel 1 echo Startup failed. Review the error above.\\npause\\n',encoding='ascii')\nelse:\n starter=root/('Start-DeepSeek.command' if p.startswith('macos-') else 'Start-DeepSeek.sh');starter.write_text('#!/bin/sh\\ncd \"$(dirname \"$0\")\" || exit 1\\n\"./'+exe+'\" web\\nresult=$?\\nif [ \"$result\" -ne 0 ]; then printf \"Startup failed (%s). Press Enter to close.\" \"$result\"; read answer; fi\\nexit \"$result\"\\n');starter.chmod(0o755)\n(root/'README.txt').write_text('DeepSeek Harness Web UI, '+p+'\\nUnofficial unsigned native build of source '+os.environ['SOURCE_SHA']+'\\nExtract the entire archive. Launch Start-DeepSeek; keep the terminal open. Linux: run ./Start-DeepSeek.sh. The native EXE/binary alone is a CLI and needs the web argument.\\nThis is the Web UI distribution, not the Electron Desktop installer. Do not disable system security protections.\\nRuntime resources and ripgrep are included; optional Office/primary runtime capabilities download pinned resources from downloads.json. Linux packages are built on Ubuntu 24.04 and are not labeled manylinux or glibc 2.28 compatible. No user credentials are included. Configure your supported account yourself for model requests.\\nSee verification.json for exact checks. Linux ARM64 has native HTTP/assets checks only; no Google Chrome UI test is claimed.\\n',encoding='utf-8')\nwith tarfile.open('staged-payload.tar','w') as t:t.add(root,arcname='delivery')\nwith tarfile.open('staged-payload.tar') as t:t.extractall('staged-extraction',filter='data')\n\n'@ | Set-Content stage.py -Encoding utf8\npython stage.py\nif ($LASTEXITCODE -ne 0) { throw 'Python step failed' }"
    - name: Stage POSIX package
      if: runner.os != 'Windows'
      shell: bash
      run: "python - <<'PY'\nimport os,pathlib,shutil,json,hashlib,tarfile,zipfile\np=os.environ['PACKAGE_PLATFORM']; win=p.startswith('win-'); root=pathlib.Path('delivery');root.mkdir();src=pathlib.Path('dist-exe');exe='deepseek-harness-sdk-runtime-'+p+('.exe' if win else '')\nfor name in [exe,'deepseek-harness-sdk-runtime-'+p+('-rg.exe' if win else '-rg')]:shutil.copy2(src/name,root/name)\nif p.startswith('macos-'):shutil.copy2(src/(exe+'-spawn-helper'),root/(exe+'-spawn-helper'))\nshutil.copytree(src/p,root/p);shutil.copy2('LICENSE',root/'LICENSE.txt')\nif win:\n (root/'Start-DeepSeek.cmd').write_text('@echo off\\ncd /d \"%~dp0\"\\necho Starting DeepSeek Harness Web UI. Keep this window open.\\n\"%~dp0'+exe+'\" web\\nif errorlevel 1 echo Startup failed. Review the error above.\\npause\\n',encoding='ascii')\nelse:\n starter=root/('Start-DeepSeek.command' if p.startswith('macos-') else 'Start-DeepSeek.sh');starter.write_text('#!/bin/sh\\ncd \"$(dirname \"$0\")\" || exit 1\\n\"./'+exe+'\" web\\nresult=$?\\nif [ \"$result\" -ne 0 ]; then printf \"Startup failed (%s). Press Enter to close.\" \"$result\"; read answer; fi\\nexit \"$result\"\\n');starter.chmod(0o755)\n(root/'README.txt').write_text('DeepSeek Harness Web UI, '+p+'\\nUnofficial unsigned native build of source '+os.environ['SOURCE_SHA']+'\\nExtract the entire archive. Launch Start-DeepSeek; keep the terminal open. Linux: run ./Start-DeepSeek.sh. The native EXE/binary alone is a CLI and needs the web argument.\\nThis is the Web UI distribution, not the Electron Desktop installer. Do not disable system security protections.\\nRuntime resources and ripgrep are included; optional Office/primary runtime capabilities download pinned resources from downloads.json. Linux packages are built on Ubuntu 24.04 and are not labeled manylinux or glibc 2.28 compatible. No user credentials are included. Configure your supported account yourself for model requests.\\nSee verification.json for exact checks. Linux ARM64 has native HTTP/assets checks only; no Google Chrome UI test is claimed.\\n',encoding='utf-8')\nwith tarfile.open('staged-payload.tar','w') as t:t.add(root,arcname='delivery')\nwith tarfile.open('staged-payload.tar') as t:t.extractall('staged-extraction',filter='data')\n\nPY"
    - name: Install isolated official test tooling
      shell: bash
      run: npm install --prefix "$RUNNER_TEMP/harness-test-tools" --no-audit --no-fund playwright-core@1.61.1
    - name: Verify Windows HTTP assets and Chrome UI twice
      if: runner.os == 'Windows'
      shell: pwsh
      run: "@'\nconst fs=require('node:fs'),path=require('node:path'),{spawn,execFileSync}=require('node:child_process');\nconst {chromium,request}=require(path.join(process.env.RUNNER_TEMP,'harness-test-tools/node_modules/playwright-core'));\nconst out=path.resolve('staged-extraction/delivery'),report=path.resolve('delivery'),platform=process.env.PACKAGE_PLATFORM,windows=process.platform==='win32';\nconst binary=path.join(out,'deepseek-harness-sdk-runtime-'+platform+(windows?'.exe':''));\nlet phase='start',trial=0,lastPage,diagnostics={};\nconst scrub=s=>String(s).replace(/@deepseek-ai\\/([a-z0-9-]+)/g,(_,n)=>'PKG['+n.replace(/-/g,' ')+']').replace(/https?:\\/\\/[^\\s]+/g,'[URL]').replace(/[A-Za-z0-9_+=\\/-]{24,}/g,'[REDACTED]');\n(async()=>{const evidence=[];\nfor(trial=1;trial<=2;trial++){\n let output=''; const child=spawn(binary,['web','--no-open','--port','3080'],{cwd:out,env:{...process.env,DSH_HOME:path.join(process.env.RUNNER_TEMP,'harness-test-home'),DSH_TELEMETRY_DISABLED:'1'},stdio:['ignore','pipe','pipe'],detached:!windows});\n child.stdout.on('data',b=>output+=b.toString());child.stderr.on('data',b=>output+=b.toString());let browser,api;\n try{phase='wait-server';let launch;\n for(let i=0;i<120;i++){let m=output.match(/dsh web: (http:\\/\\/127\\.0\\.0\\.1:3080\\/\\S+)/);if(m){launch=m[1];break}if(child.exitCode!==null)throw Error('Server exited');await new Promise(r=>setTimeout(r,1000))}\n if(!launch)throw Error('Startup URL absent');\n phase='http';api=await request.newContext();const response=await api.get(launch);if(response.status()!==200)throw Error('HTTP not 200');const html=await response.text();\n const assets=[...html.matchAll(/(?:src|href)=[\"']([^\"']+\\.(?:js|css)(?:\\?[^\"']*)?)[\"']/g)].map(m=>new URL(m[1],'http://127.0.0.1:3080/'));\n if(!assets.length)throw Error('No frontend assets');for(const asset of assets){if(asset.origin!=='http://127.0.0.1:3080')throw Error('Unexpected external asset');const a=await api.get(asset.href);if(a.status()!==200||(await a.body()).length<1)throw Error('Missing frontend asset')}\n let ui='not-tested-no-official-Chrome-linux-arm64',visibleTextLength=null;\n if(platform!=='linux-arm64'){\n phase='launch-chrome';browser=await chromium.launch({channel:'chrome',headless:true});const page=await browser.newPage();lastPage=page;let pageErrors=0;diagnostics={pageErrors:[],consoleErrors:[]};page.on('pageerror',e=>{pageErrors++;diagnostics.pageErrors.push(scrub(e.message))});page.on('console',m=>{if(m.type()==='error')diagnostics.consoleErrors.push(scrub(m.text()))});phase='navigate';await page.goto(launch,{waitUntil:'domcontentloaded',timeout:60000});phase='render';await page.waitForFunction(()=>document.body&&document.body.innerText.trim().length>=15,null,{timeout:60000});visibleTextLength=(await page.locator('body').innerText()).trim().length;\n phase='app-controls';await page.waitForFunction(()=>document.querySelector('button,input,textarea,[role=button]') && /deepseek|new chat|settings|sign in|log in|\u65B0\u4F1A\u8BDD|\u8BBE\u7F6E|\u767B\u5F55/i.test(document.body.innerText),null,{timeout:60000});if(pageErrors)throw Error('Frontend exceptions');\n phase='check-auth-redirect';const clean=new URL(page.url());if(clean.search||clean.hash)throw Error('Authentication URL not scrubbed');phase='screenshot';await page.screenshot({path:path.join(report,`startup-${trial}.png`),fullPage:true});ui='passed-native-Chrome';}\n evidence.push({trial,httpStatus:200,assetCount:assets.length,ui,visibleTextLength});\n }catch(e){if(lastPage){try{diagnostics.body=scrub((await lastPage.locator('body').innerText()).slice(0,4000));diagnostics.controls=await lastPage.locator('button,input,textarea,[role=button]').count();diagnostics.boot=await lastPage.evaluate(()=>({visible:!!document.querySelector('[data-dsh-boot]'),spinner:!!document.querySelector('[data-dsh-boot-spinner]'),moduleLoader:typeof window.__ModuleLoader__,boot:typeof window.__DSH_BOOT__,ready:typeof window.__DSH_BOOT_READY__,entryIds:(window.__DSH_BOOT__?.entries||[]).map(e=>e.id)}));}catch{}}throw e;}finally{if(browser)await browser.close();if(api)await api.dispose();if(child.exitCode===null){try{if(windows)execFileSync('taskkill',['/PID',String(child.pid),'/T','/F'],{stdio:'ignore'});else process.kill(-child.pid,'SIGTERM')}catch{}}output='';for(let i=0;i<150&&child.exitCode===null;i++)await new Promise(r=>setTimeout(r,100));if(child.exitCode===null){try{if(!windows)process.kill(-child.pid,'SIGKILL')}catch{}await new Promise(r=>setTimeout(r,1000));}}\n}\nfs.writeFileSync(path.join(report,'verification.json'),JSON.stringify({source:process.env.SOURCE_SHA,platform,host:process.platform,arch:process.arch,checkedAt:new Date().toISOString(),checks:evidence,modelAuthentication:'not tested; no credentials provided'},null,2));\n})().catch(e=>{const diagnostic={result:'failed',phase,trial,errorClass:e?.name||'Error',diagnostics,rawOutput:'withheld'};fs.writeFileSync('startup-diagnostic.json',JSON.stringify(diagnostic,null,2));console.error(JSON.stringify(diagnostic));process.exitCode=1});\n'@ | Set-Content harness-smoke.cjs -Encoding utf8\nnode harness-smoke.cjs\nif ($LASTEXITCODE -ne 0) { throw 'Startup verification failed' }"
    - name: Verify POSIX HTTP assets and available Chrome UI twice
      if: runner.os != 'Windows'
      shell: bash
      run: "cat > harness-smoke.cjs <<'JS'\nconst fs=require('node:fs'),path=require('node:path'),{spawn,execFileSync}=require('node:child_process');\nconst {chromium,request}=require(path.join(process.env.RUNNER_TEMP,'harness-test-tools/node_modules/playwright-core'));\nconst out=path.resolve('staged-extraction/delivery'),report=path.resolve('delivery'),platform=process.env.PACKAGE_PLATFORM,windows=process.platform==='win32';\nconst binary=path.join(out,'deepseek-harness-sdk-runtime-'+platform+(windows?'.exe':''));\nlet phase='start',trial=0,lastPage,diagnostics={};\nconst scrub=s=>String(s).replace(/@deepseek-ai\\/([a-z0-9-]+)/g,(_,n)=>'PKG['+n.replace(/-/g,' ')+']').replace(/https?:\\/\\/[^\\s]+/g,'[URL]').replace(/[A-Za-z0-9_+=\\/-]{24,}/g,'[REDACTED]');\n(async()=>{const evidence=[];\nfor(trial=1;trial<=2;trial++){\n let output=''; const child=spawn(binary,['web','--no-open','--port','3080'],{cwd:out,env:{...process.env,DSH_HOME:path.join(process.env.RUNNER_TEMP,'harness-test-home'),DSH_TELEMETRY_DISABLED:'1'},stdio:['ignore','pipe','pipe'],detached:!windows});\n child.stdout.on('data',b=>output+=b.toString());child.stderr.on('data',b=>output+=b.toString());let browser,api;\n try{phase='wait-server';let launch;\n for(let i=0;i<120;i++){let m=output.match(/dsh web: (http:\\/\\/127\\.0\\.0\\.1:3080\\/\\S+)/);if(m){launch=m[1];break}if(child.exitCode!==null)throw Error('Server exited');await new Promise(r=>setTimeout(r,1000))}\n if(!launch)throw Error('Startup URL absent');\n phase='http';api=await request.newContext();const response=await api.get(launch);if(response.status()!==200)throw Error('HTTP not 200');const html=await response.text();\n const assets=[...html.matchAll(/(?:src|href)=[\"']([^\"']+\\.(?:js|css)(?:\\?[^\"']*)?)[\"']/g)].map(m=>new URL(m[1],'http://127.0.0.1:3080/'));\n if(!assets.length)throw Error('No frontend assets');for(const asset of assets){if(asset.origin!=='http://127.0.0.1:3080')throw Error('Unexpected external asset');const a=await api.get(asset.href);if(a.status()!==200||(await a.body()).length<1)throw Error('Missing frontend asset')}\n let ui='not-tested-no-official-Chrome-linux-arm64',visibleTextLength=null;\n if(platform!=='linux-arm64'){\n phase='launch-chrome';browser=await chromium.launch({channel:'chrome',headless:true});const page=await browser.newPage();lastPage=page;let pageErrors=0;diagnostics={pageErrors:[],consoleErrors:[]};page.on('pageerror',e=>{pageErrors++;diagnostics.pageErrors.push(scrub(e.message))});page.on('console',m=>{if(m.type()==='error')diagnostics.consoleErrors.push(scrub(m.text()))});phase='navigate';await page.goto(launch,{waitUntil:'domcontentloaded',timeout:60000});phase='render';await page.waitForFunction(()=>document.body&&document.body.innerText.trim().length>=15,null,{timeout:60000});visibleTextLength=(await page.locator('body').innerText()).trim().length;\n phase='app-controls';await page.waitForFunction(()=>document.querySelector('button,input,textarea,[role=button]') && /deepseek|new chat|settings|sign in|log in|\u65B0\u4F1A\u8BDD|\u8BBE\u7F6E|\u767B\u5F55/i.test(document.body.innerText),null,{timeout:60000});if(pageErrors)throw Error('Frontend exceptions');\n phase='check-auth-redirect';const clean=new URL(page.url());if(clean.search||clean.hash)throw Error('Authentication URL not scrubbed');phase='screenshot';await page.screenshot({path:path.join(report,`startup-${trial}.png`),fullPage:true});ui='passed-native-Chrome';}\n evidence.push({trial,httpStatus:200,assetCount:assets.length,ui,visibleTextLength});\n }catch(e){if(lastPage){try{diagnostics.body=scrub((await lastPage.locator('body').innerText()).slice(0,4000));diagnostics.controls=await lastPage.locator('button,input,textarea,[role=button]').count();diagnostics.boot=await lastPage.evaluate(()=>({visible:!!document.querySelector('[data-dsh-boot]'),spinner:!!document.querySelector('[data-dsh-boot-spinner]'),moduleLoader:typeof window.__ModuleLoader__,boot:typeof window.__DSH_BOOT__,ready:typeof window.__DSH_BOOT_READY__,entryIds:(window.__DSH_BOOT__?.entries||[]).map(e=>e.id)}));}catch{}}throw e;}finally{if(browser)await browser.close();if(api)await api.dispose();if(child.exitCode===null){try{if(windows)execFileSync('taskkill',['/PID',String(child.pid),'/T','/F'],{stdio:'ignore'});else process.kill(-child.pid,'SIGTERM')}catch{}}output='';for(let i=0;i<150&&child.exitCode===null;i++)await new Promise(r=>setTimeout(r,100));if(child.exitCode===null){try{if(!windows)process.kill(-child.pid,'SIGKILL')}catch{}await new Promise(r=>setTimeout(r,1000));}}\n}\nfs.writeFileSync(path.join(report,'verification.json'),JSON.stringify({source:process.env.SOURCE_SHA,platform,host:process.platform,arch:process.arch,checkedAt:new Date().toISOString(),checks:evidence,modelAuthentication:'not tested; no credentials provided'},null,2));\n})().catch(e=>{const diagnostic={result:'failed',phase,trial,errorClass:e?.name||'Error',diagnostics,rawOutput:'withheld'};fs.writeFileSync('startup-diagnostic.json',JSON.stringify(diagnostic,null,2));console.error(JSON.stringify(diagnostic));process.exitCode=1});\nJS\nnode harness-smoke.cjs"
    - name: Archive Windows package
      if: runner.os == 'Windows'
      shell: pwsh
      run: "@'\nimport pathlib,hashlib,json,tarfile,zipfile,os\nr=pathlib.Path('delivery'); entries={str(p.relative_to(r)).replace('\\\\','/'):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()};(r/'SHA256SUMS.txt').write_text(''.join(v+'  '+k+'\\n' for k,v in entries.items()))\nname='deepseek-harness-0.2.1-rc.2-'+os.environ['PACKAGE_PLATFORM']+'-web';pathlib.Path('release-assets').mkdir(exist_ok=True)\nif os.name=='nt':\n out=pathlib.Path('release-assets')/(name+'.zip')\n with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:\n  for p in r.rglob('*'):\n   if p.is_file():z.write(p,str(p.relative_to(r)))\n with zipfile.ZipFile(out) as z:assert z.testzip() is None\nelse:\n out=pathlib.Path('release-assets')/(name+'.tar.gz')\n with tarfile.open(out,'w:gz') as t:t.add(r,arcname=name)\n with tarfile.open(out,'r:gz') as t:assert len(t.getmembers())>3\nh=hashlib.sha256(out.read_bytes()).hexdigest();out.with_name(out.name+'.sha256').write_text(h+'  '+out.name+'\\n');print(out.name,h)\n'@ | Set-Content package.py -Encoding utf8\npython package.py\nif ($LASTEXITCODE -ne 0) { throw 'Python step failed' }"
    - name: Archive POSIX package
      if: runner.os != 'Windows'
      shell: bash
      run: "python - <<'PY'\nimport pathlib,hashlib,json,tarfile,zipfile,os\nr=pathlib.Path('delivery'); entries={str(p.relative_to(r)).replace('\\\\','/'):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()};(r/'SHA256SUMS.txt').write_text(''.join(v+'  '+k+'\\n' for k,v in entries.items()))\nname='deepseek-harness-0.2.1-rc.2-'+os.environ['PACKAGE_PLATFORM']+'-web';pathlib.Path('release-assets').mkdir(exist_ok=True)\nif os.name=='nt':\n out=pathlib.Path('release-assets')/(name+'.zip')\n with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:\n  for p in r.rglob('*'):\n   if p.is_file():z.write(p,str(p.relative_to(r)))\n with zipfile.ZipFile(out) as z:assert z.testzip() is None\nelse:\n out=pathlib.Path('release-assets')/(name+'.tar.gz')\n with tarfile.open(out,'w:gz') as t:t.add(r,arcname=name)\n with tarfile.open(out,'r:gz') as t:assert len(t.getmembers())>3\nh=hashlib.sha256(out.read_bytes()).hexdigest();out.with_name(out.name+'.sha256').write_text(h+'  '+out.name+'\\n');print(out.name,h)\nPY"
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: deepseek-${{ matrix.platform }}
        path: release-assets/*
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
    - name: Retain generated public client source for diagnosis
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: client-source-${{ matrix.platform }}
        path: 'packages/api/workspace-controller/lib/client.js

          packages/api/workspace-controller/package.json'
        retention-days: 3
        if-no-files-found: warn
    - name: Retain safe failure phase
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: diagnostic-${{ matrix.platform }}
        path: startup-diagnostic.json
        if-no-files-found: ignore
        retention-days: 3
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        pattern: deepseek-*
        path: release-assets
        merge-multiple: true
    - name: Verify archives and publish versioned release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: 'set -euo pipefail

        cd release-assets

        for checksum in *.sha256; do sha256sum -c "$checksum"; done

        test "$(find . -maxdepth 1 -name ''*.sha256'' | wc -l)" -eq 5

        tag="deepseek-0.2.1-rc.2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        printf ''%s

        '' ''Unofficial native Web UI packages, source bb8e649df3c976c9cd965037593f353009992ae3.'' ''Windows/Linux/macOS; see verification.json inside each archive for exact tests. Linux ARM64: native HTTP/assets checks, no Chrome UI check. No model credentials or live model tests. Unsigned packages; do not disable OS security protections.'' > "$RUNNER_TEMP/release-notes.txt"

        gh release create "$tag" ./* --repo "$GH_REPO" --target "$GITHUB_SHA" --title "DeepSeek Harness 0.2.1-rc.2 native Web UI" --notes-file "$RUNNER_TEMP/release-notes.txt" --prerelease

        gh release view "$tag" --repo "$GH_REPO" --json url,assets > "$RUNNER_TEMP/published-release.json"

        python -c ''import json,os;x=json.load(open(os.environ["RUNNER_TEMP"]+"/published-release.json"));assert len(x["assets"])==10;assert all(a["size"]>0 for a in x["assets"]);print(x["url"])'' '

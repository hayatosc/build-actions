        \ lastPage.locator('button,input,textarea,[role=button]').count();diagnostics.boot=await lastPage.evaluate(()=>({visible:!!document.querySelector('[data-dsh-boot]'),spinner:!!document.querySelector('[data-dsh-boot-spinner]'),moduleLoader:typeof\

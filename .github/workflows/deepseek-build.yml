name: Build DeepSeek all native OS packages
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/deepseek-build.yml
    - deepseek-build-request.txt
permissions:
  contents: read
concurrency:
  group: deepseek-allos
  cancel-in-progress: false
env:
  SOURCE_SHA: bb8e649df3c976c9cd965037593f353009992ae3
  DSH_TELEMETRY_DISABLED: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: node24-linux-x64
          platform: linux-x64
          runner: ubuntu-24.04
        - target: node24-linux-arm64
          platform: linux-arm64
          runner: ubuntu-24.04-arm
        - target: node24-macos-arm64
          platform: macos-arm64
          runner: macos-latest
        - target: node24-macos-x64
          platform: macos-x64
          runner: macos-15-intel
        - target: node24-win-x64
          platform: win-x64
          runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PACKAGE_PLATFORM: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        repository: shiguredo/deepseek-harness
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.19.0
    - uses: actions/setup-python@v6.3.0
      with:
        python-version: '3.12'
    - uses: pnpm/action-setup@v5.0.0
      with:
        version: 11.28.5
    - name: Check immutable source and native symlink support
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        node -e "const fs=require(''fs''),p=require(''path''),r=p.join(process.env.RUNNER_TEMP,''harness-symlink-check'');fs.mkdirSync(r,{recursive:true});fs.writeFileSync(p.join(r,''source''),''test'');fs.symlinkSync(p.join(r,''source''),p.join(r,''link''),''file'');if(fs.readFileSync(p.join(r,''link''),''utf8'')!==''test'')throw
        Error(''Symlink support absent; no security settings will be changed'')"'
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Apply bounded Windows direct EXE entry and native browser handoff
      if: runner.os == 'Windows'
      shell: bash
      run: "python - <<'PY'\nfrom pathlib import Path\np=Path('python/sdk-runtime/runtime-bootstrap.mjs');s=p.read_text()\n\
        needle=\"  const { runCli } = await import('@deepseek-ai/dsh/lib/bin.js')\"\nassert s.count(needle)==1\ns=s.replace(needle,\"\
        \"\"  // Downstream Windows double-click entry; explicit CLI and subprocess routes remain unchanged.\n  const doubleClick\
        \ = process.platform === 'win32' && isSea() && process.argv.length === 2\n  if (doubleClick) {\n    process.argv.push('web')\n\
        \    if (process.stdin.isTTY) process.on('exit', (code) => {\n      if (code !== 0) {\n        console.error('DeepSeek\
        \ Harness could not start. Review the error above. Press Enter to close.')\n        try { const fs = process.getBuiltinModule('fs');\
        \ fs.readSync(0, Buffer.alloc(1), 0, 1, null) } catch {}\n      }\n    })\n  }\n\"\"\"+needle);p.write_text(s)\np=Path('packages/bundle/web-app/src/index.ts');s=p.read_text();s=s.replace(\"\
        import { createRequire } from 'node:module'\",\"import { createRequire } from 'node:module'\\nimport { isSea } from\
        \ 'node:sea'\")\nneedle='function spawnBrowserLauncher(url: string): ChildProcess {';assert s.count(needle)==1\ns=s.replace(needle,needle+\"\
        \"\"\n  if (process.platform === 'win32' && isSea()) {\n    return spawn(join(dirname(process.execPath), 'deepseek-browser-open.exe'),\
        \ [url], {\n      env: scrubbedParentEnv(), stdio: ['ignore', 'inherit', 'pipe'], windowsHide: true,\n    })\n  }\n\
        \"\"\");p.write_text(s)\n\nPY\ngit diff -- python/sdk-runtime/runtime-bootstrap.mjs packages/bundle/web-app/src/index.ts\
        \ > windows-entry.patch"
    - name: Build official native runtime
      shell: bash
      env:
        DSH_BUILD_CLIENT_PROFILE: official
      run: pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets=${{ matrix.target }}
    - name: Verify Workspace client deployment and repair only missing package
      shell: bash
      env:
        BUILD_TARGET: ${{ matrix.target }}
      run: "node <<'JS'\nconst fs=require('node:fs'),path=require('node:path');\nconst name='@deepseek-ai/dsh-api-workspace-controller';\n\
        const root='python/sdk-runtime/src/deepseek_harness_runtime/runtime/node/node_modules/'+name;\nconst paths=['package.json','lib/client.js'];\n\
        const missing=paths.filter(f=>!fs.existsSync(path.join(root,f)));\nconst result={package:name,missing,repair:missing.length?'direct-workspace-dependency':'none'};\n\
        console.log(JSON.stringify(result));fs.writeFileSync('deployment-repair.json',JSON.stringify(result,null,2));\nif(missing.length){\n\
        \ const source=JSON.parse(fs.readFileSync('packages/api/workspace-controller/package.json','utf8'));\n if(source.name!==name||source.dsh?.client?.platform!=='web')throw\
        \ Error('Unexpected source manifest');\n const file='python/sdk-runtime/package.json';const m=JSON.parse(fs.readFileSync(file,'utf8'));\n\
        \ if(m.dependencies[name])throw Error('Direct dependency already present; refuse speculative repair');\n const peer='@deepseek-ai/dsh-host-directory-picker';if(source.peerDependencies?.[peer]!=='workspace:*')throw\
        \ Error('Required peer declaration changed');const peerSource=JSON.parse(fs.readFileSync('packages/host/directory-picker/package.json','utf8'));if(peerSource.name!==peer)throw\
        \ Error('Unexpected peer source');m.dependencies[name]='workspace:*';m.dependencies[peer]='workspace:*';fs.writeFileSync(file,JSON.stringify(m,null,2)+'\\\
        n');\n fs.writeFileSync('repair-needed','yes');\n}\nJS\nif [ -f repair-needed ]; then\n  pnpm install --lockfile-only\
        \ --ignore-scripts\n  pnpm install --frozen-lockfile --ignore-scripts\n  pnpm exec tsx scripts/build-exe-for-python-sdk.ts\
        \ --targets=\"$BUILD_TARGET\" --skip-build\nfi\nnode <<'JS'\nconst fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),{createRequire}=require('node:module'),{execFileSync}=require('node:child_process');\n\
        const name='@deepseek-ai/dsh-api-workspace-controller',base=path.resolve('python/sdk-runtime/src/deepseek_harness_runtime/runtime/node/node_modules');\n\
        const req=createRequire(path.join(base,'@deepseek-ai/dsh-web-app/package.json'));\nconst manifest=req.resolve(name+'/package.json'),entry=req.resolve(name);\n\
        const m=JSON.parse(fs.readFileSync(manifest,'utf8'));\nif(m.name!==name||m.dsh?.client?.platform!=='web')throw Error('Deployed\
        \ client manifest mismatch');\nconst client=path.join(path.dirname(manifest),'lib/client.js');if(!fs.existsSync(client))throw\
        \ Error('Deployed browser bundle absent');\nconst sha=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');\n\
        const result=JSON.parse(fs.readFileSync('deployment-repair.json','utf8'));\nresult.verified=true;result.verifiedAt=new\
        \ Date().toISOString();result.source=process.env.SOURCE_SHA;\nresult.resolvedManifest=path.relative(base,manifest);result.resolvedEntry=path.relative(base,entry);\n\
        result.hashes={sdkManifest:sha('python/sdk-runtime/package.json'),lockfile:sha('pnpm-lock.yaml'),deployedClient:sha(client),sourceClient:sha('packages/api/workspace-controller/lib/client.js')};\n\
        if(result.hashes.deployedClient!==result.hashes.sourceClient)throw Error('Deployed client differs from official generated\
        \ bundle');\nconst patch=execFileSync('git',['diff','--','python/sdk-runtime/package.json','pnpm-lock.yaml'],{encoding:'utf8'});\n\
        fs.writeFileSync('deployment-repair.patch',patch);result.patchSha256=sha('deployment-repair.patch');\nfs.writeFileSync('deployment-repair.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));\n\
        JS\n"
    - name: Compile native Windows browser helper
      if: runner.os == 'Windows'
      shell: pwsh
      run: "@'\n#define UNICODE\n#define _UNICODE\n#include <windows.h>\n#include <shellapi.h>\n#include <string>\n#include\
        \ <cstdio>\nint wmain(int argc, wchar_t **argv) {\n  if (argc != 2) return 2;\n  std::wstring url(argv[1]);\n  //\
        \ Only pass app-generated HTTP(S) URLs to the registered browser, never commands or files.\n  if (url.rfind(L\"http://\"\
        ,0)!=0 && url.rfind(L\"https://\",0)!=0) return 3;\n  for (wchar_t c : url) if (c < 32 || c == L'\"') return 3;\n\
        \  HRESULT com = CoInitializeEx(nullptr, COINIT_APARTMENTTHREADED | COINIT_DISABLE_OLE1DDE);\n  if (FAILED(com)) {\
        \ std::fprintf(stderr,\"Windows browser COM initialization failed (error %ld).\\n\",long(com)); return 1; }\n  SHELLEXECUTEINFOW\
        \ info{}; info.cbSize=sizeof(info);\n  info.fMask=SEE_MASK_NOCLOSEPROCESS|SEE_MASK_NOASYNC|SEE_MASK_FLAG_NO_UI;\n\
        \  info.lpVerb=L\"open\"; info.lpFile=url.c_str(); info.nShow=SW_SHOWNORMAL;\n  if (!ShellExecuteExW(&info)) { std::fprintf(stderr,\"\
        Windows browser handoff failed (error %lu).\\n\",GetLastError()); CoUninitialize(); return 1; }\n  if(info.hProcess)\
        \ CloseHandle(info.hProcess);\n  CoUninitialize();\n  std::puts(\"deepseek browser: native Windows handoff accepted\"\
        );\n  return 0;\n}\n'@ | Set-Content windows-browser-open.cpp -Encoding utf8\n$vs = & \"${env:ProgramFiles(x86)}\\\
        Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64\
        \ -property installationPath\nif (-not $vs) { throw 'Official Visual Studio C++ toolchain missing' }\n$dev = Join-Path\
        \ $vs 'Common7\\Tools\\Launch-VsDevShell.ps1'\n& $dev -Arch amd64 -HostArch amd64 -SkipAutomaticLocation\ncl.exe /nologo\
        \ /O2 /MT /EHsc /std:c++17 windows-browser-open.cpp /Fe:dist-exe\\deepseek-browser-open.exe /link shell32.lib ole32.lib\n\
        if ($LASTEXITCODE -ne 0) { throw 'Native browser helper compilation failed' }\n"
    - name: Stage Windows package
      if: runner.os == 'Windows'
      shell: pwsh
      run: "@'\nimport os,pathlib,shutil,json,hashlib,tarfile,zipfile\np=os.environ['PACKAGE_PLATFORM']; win=p.startswith('win-');\
        \ root=pathlib.Path('delivery');root.mkdir();shutil.copy2(\"deployment-repair.json\",root/\"deployment-repair.json\"\
        );shutil.copy2(\"deployment-repair.patch\",root/\"deployment-repair.patch\");src=pathlib.Path('dist-exe');exe='deepseek-harness-sdk-runtime-'+p+('.exe'\
        \ if win else '')\nfor name in [exe,'deepseek-harness-sdk-runtime-'+p+('-rg.exe' if win else '-rg')]:shutil.copy2(src/name,root/name)\n\
        if p.startswith('macos-'):shutil.copy2(src/(exe+'-spawn-helper'),root/(exe+'-spawn-helper'))\nshutil.copytree(src/p,root/p);shutil.copy2('LICENSE',root/'LICENSE.txt')\n\
        if win:\n shutil.copy2(src/'deepseek-browser-open.exe',root/'deepseek-browser-open.exe');shutil.copy2('windows-entry.patch',root/'windows-entry.patch');shutil.copy2('windows-browser-open.cpp',root/'windows-browser-open.cpp')\n\
        else:\n starter=root/('Start-DeepSeek.command' if p.startswith('macos-') else 'Start-DeepSeek.sh');starter.write_text('#!/bin/sh\\\
        ncd \"$(dirname \"$0\")\" || exit 1\\n\"./'+exe+'\" web\\nresult=$?\\nif [ \"$result\" -ne 0 ]; then printf \"Startup\
        \ failed (%s). Press Enter to close.\" \"$result\"; read answer; fi\\nexit \"$result\"\\n');starter.chmod(0o755)\n\
        (root/'README.txt').write_text('DeepSeek Harness Web UI, '+p+'\\nUnofficial unsigned native build; see deployment-repair.json\
        \ and deployment-repair.patch for any downstream runtime-dependency closure correction. Base source '+os.environ['SOURCE_SHA']+'\\\
        nOn Linux the automatic Documents location uses xdg-user-dir. If that OS utility or location is unavailable, use Choose\
        \ workspace to select a folder. Workspace smoke tests use an isolated configured Documents directory.\\nExtract the\
        \ entire archive. Windows: double-click deepseek-harness-sdk-runtime-win-x64.exe directly; no CMD script is needed.\
        \ Keep its application window open while using the Web UI. Companion win-x64 resources, ripgrep and deepseek-browser-open.exe\
        \ must stay beside it. Native browser helper uses the Windows registered browser, without command scripts. Non-Windows:\
        \ launch Start-DeepSeek; Linux: run ./Start-DeepSeek.sh. Explicit CLI arguments remain supported. Windows downstream\
        \ source adjustment is recorded in windows-entry.patch.\\nThis is the Web UI distribution, not the Electron Desktop\
        \ installer. Do not disable system security protections.\\nRuntime resources and ripgrep are included; optional Office/primary\
        \ runtime capabilities download pinned resources from downloads.json. Linux packages are built on Ubuntu 24.04 and\
        \ are not labeled manylinux or glibc 2.28 compatible. No user credentials are included. Configure your supported account\
        \ yourself for model requests.\\nSee verification.json for exact checks. Linux ARM64 has native HTTP/assets checks\
        \ only; no Google Chrome UI test is claimed.\\n',encoding='utf-8')\nwith tarfile.open('staged-payload.tar','w') as\
        \ t:t.add(root,arcname='delivery')\nwith tarfile.open('staged-payload.tar') as t:t.extractall('staged-extraction',filter='data')\n\
        \n'@ | Set-Content stage.py -Encoding utf8\npython stage.py\nif ($LASTEXITCODE -ne 0) { throw 'Python step failed'\
        \ }"
    - name: Stage POSIX package
      if: runner.os != 'Windows'
      shell: bash
      run: "python - <<'PY'\nimport os,pathlib,shutil,json,hashlib,tarfile,zipfile\np=os.environ['PACKAGE_PLATFORM']; win=p.startswith('win-');\
        \ root=pathlib.Path('delivery');root.mkdir();shutil.copy2(\"deployment-repair.json\",root/\"deployment-repair.json\"\
        );shutil.copy2(\"deployment-repair.patch\",root/\"deployment-repair.patch\");src=pathlib.Path('dist-exe');exe='deepseek-harness-sdk-runtime-'+p+('.exe'\
        \ if win else '')\nfor name in [exe,'deepseek-harness-sdk-runtime-'+p+('-rg.exe' if win else '-rg')]:shutil.copy2(src/name,root/name)\n\
        if p.startswith('macos-'):shutil.copy2(src/(exe+'-spawn-helper'),root/(exe+'-spawn-helper'))\nshutil.copytree(src/p,root/p);shutil.copy2('LICENSE',root/'LICENSE.txt')\n\
        if win:\n shutil.copy2(src/'deepseek-browser-open.exe',root/'deepseek-browser-open.exe');shutil.copy2('windows-entry.patch',root/'windows-entry.patch');shutil.copy2('windows-browser-open.cpp',root/'windows-browser-open.cpp')\n\
        else:\n starter=root/('Start-DeepSeek.command' if p.startswith('macos-') else 'Start-DeepSeek.sh');starter.write_text('#!/bin/sh\\\
        ncd \"$(dirname \"$0\")\" || exit 1\\n\"./'+exe+'\" web\\nresult=$?\\nif [ \"$result\" -ne 0 ]; then printf \"Startup\
        \ failed (%s). Press Enter to close.\" \"$result\"; read answer; fi\\nexit \"$result\"\\n');starter.chmod(0o755)\n\
        (root/'README.txt').write_text('DeepSeek Harness Web UI, '+p+'\\nUnofficial unsigned native build; see deployment-repair.json\
        \ and deployment-repair.patch for any downstream runtime-dependency closure correction. Base source '+os.environ['SOURCE_SHA']+'\\\
        nOn Linux the automatic Documents location uses xdg-user-dir. If that OS utility or location is unavailable, use Choose\
        \ workspace to select a folder. Workspace smoke tests use an isolated configured Documents directory.\\nExtract the\
        \ entire archive. Windows: double-click deepseek-harness-sdk-runtime-win-x64.exe directly; no CMD script is needed.\
        \ Keep its application window open while using the Web UI. Companion win-x64 resources, ripgrep and deepseek-browser-open.exe\
        \ must stay beside it. Native browser helper uses the Windows registered browser, without command scripts. Non-Windows:\
        \ launch Start-DeepSeek; Linux: run ./Start-DeepSeek.sh. Explicit CLI arguments remain supported. Windows downstream\
        \ source adjustment is recorded in windows-entry.patch.\\nThis is the Web UI distribution, not the Electron Desktop\
        \ installer. Do not disable system security protections.\\nRuntime resources and ripgrep are included; optional Office/primary\
        \ runtime capabilities download pinned resources from downloads.json. Linux packages are built on Ubuntu 24.04 and\
        \ are not labeled manylinux or glibc 2.28 compatible. No user credentials are included. Configure your supported account\
        \ yourself for model requests.\\nSee verification.json for exact checks. Linux ARM64 has native HTTP/assets checks\
        \ only; no Google Chrome UI test is claimed.\\n',encoding='utf-8')\nwith tarfile.open('staged-payload.tar','w') as\
        \ t:t.add(root,arcname='delivery')\nwith tarfile.open('staged-payload.tar') as t:t.extractall('staged-extraction',filter='data')\n\
        \nPY"
    - name: Install isolated official test tooling
      shell: bash
      run: npm install --prefix "$RUNNER_TEMP/harness-test-tools" --no-audit --no-fund playwright-core@1.61.1
    - name: Verify direct Windows EXE browser handoff and workspace twice
      if: runner.os == 'Windows'
      shell: pwsh
      run: "@'\nconst fs=require('node:fs'),path=require('node:path'),{spawn,execFileSync}=require('node:child_process');\n\
        const {chromium,request}=require(path.join(process.env.RUNNER_TEMP,'harness-test-tools/node_modules/playwright-core'));\n\
        const out=path.resolve('staged-extraction/delivery'),report=path.resolve('delivery'),platform=process.env.PACKAGE_PLATFORM,windows=process.platform==='win32';\n\
        const binary=path.join(out,'deepseek-harness-sdk-runtime-'+platform+(windows?'.exe':''));\nlet phase='start',trial=0,lastPage,diagnostics={};\n\
        const scrub=s=>String(s).replace(/@deepseek-ai\\/([a-z0-9-]+)/g,(_,n)=>'PKG['+n.replace(/-/g,' ')+']').replace(/https?:\\\
        /\\/[^\\s]+/g,'[URL]').replace(/[A-Za-z0-9_+=\\/-]{24,}/g,'[REDACTED]');\n(async()=>{const evidence=[];const fixture=path.join(process.env.RUNNER_TEMP,'harness-workspace-documents');fs.mkdirSync(fixture,{recursive:true});const\
        \ patch=path.join(process.env.RUNNER_TEMP,'harness-workspace-test.patch.json');fs.writeFileSync(patch,JSON.stringify([{id:'workspace-controller',config:{documentsDirectory:fixture}}]));const\
        \ home=path.join(process.env.RUNNER_TEMP,'harness-test-home');fs.mkdirSync(home,{recursive:true});fs.writeFileSync(path.join(home,'cordis.patch.yml'),fs.readFileSync(patch));const\
        \ unrelated=path.join(process.env.RUNNER_TEMP,'unrelated working directory');fs.mkdirSync(unrelated,{recursive:true});\n\
        if(windows){const help=execFileSync(binary,['--help'],{cwd:unrelated,encoding:'utf8',timeout:30000});if(!/usage|options|dsh/i.test(help))throw\
        \ Error('Explicit CLI help did not render');}\nfor(trial=1;trial<=2;trial++){\n let output=''; const child=spawn(binary,windows?[]:['web','--no-open','--port','3080','--patch',patch],{cwd:unrelated,env:{...process.env,DSH_HOME:path.join(process.env.RUNNER_TEMP,'harness-test-home'),DSH_TELEMETRY_DISABLED:'1'},stdio:['ignore','pipe','pipe'],detached:!windows});\n\
        \ child.stdout.on('data',b=>output+=b.toString());child.stderr.on('data',b=>output+=b.toString());let browser,api;\n\
        \ try{phase='wait-server';let launch;\n for(let i=0;i<120;i++){let m=output.match(/dsh web: (http:\\/\\/127\\.0\\\
        .0\\.1:3080\\/\\S+)/);if(m){launch=m[1];break}if(child.exitCode!==null)throw Error('Server exited');await new Promise(r=>setTimeout(r,1000))}\n\
        \ if(!launch)throw Error('Startup URL absent');\n if(windows){phase='native-browser-handoff';for(let i=0;i<300&&!output.includes('deepseek\
        \ browser: native Windows handoff accepted');i++)await new Promise(r=>setTimeout(r,100));if(!output.includes('deepseek\
        \ browser: native Windows handoff accepted'))throw Error('Native OS browser handoff not observed');}\n phase='http';api=await\
        \ request.newContext();const response=await api.get(launch);if(response.status()!==200)throw Error('HTTP not 200');const\
        \ html=await response.text();\n const assets=[...html.matchAll(/(?:src|href)=[\"']([^\"']+\\.(?:js|css)(?:\\?[^\"\
        ']*)?)[\"']/g)].map(m=>new URL(m[1],'http://127.0.0.1:3080/'));\n if(!assets.length)throw Error('No frontend assets');for(const\
        \ asset of assets){if(asset.origin!=='http://127.0.0.1:3080')throw Error('Unexpected external asset');const a=await\
        \ api.get(asset.href);if(a.status()!==200||(await a.body()).length<1)throw Error('Missing frontend asset')}\n let\
        \ ui='not-tested-no-official-Chrome-linux-arm64',visibleTextLength=null;\n if(platform!=='linux-arm64'){\n phase='launch-chrome';browser=await\
        \ chromium.launch({channel:'chrome',headless:true});const page=await browser.newPage({locale:'en-US'});lastPage=page;let\
        \ pageErrors=0;diagnostics={pageErrors:[],consoleErrors:[]};page.on('pageerror',e=>{pageErrors++;diagnostics.pageErrors.push(scrub(e.message))});page.on('console',m=>{if(m.type()==='error')diagnostics.consoleErrors.push(scrub(m.text()))});phase='navigate';await\
        \ page.goto(launch,{waitUntil:'domcontentloaded',timeout:60000});phase='render';await page.waitForFunction(()=>document.body&&document.body.innerText.trim().length>=15,null,{timeout:60000});visibleTextLength=(await\
        \ page.locator('body').innerText()).trim().length;\n phase='app-controls';await page.waitForFunction(()=>document.querySelector('button,input,textarea,[role=button]')\
        \ && /deepseek|new chat|settings|sign in|log in|\u65B0\u4F1A\u8BDD|\u8BBE\u7F6E|\u767B\u5F55/i.test(document.body.innerText),null,{timeout:60000});if(pageErrors)throw\
        \ Error('Frontend exceptions');\n phase='workspace-onboarding';\n for(let i=0;i<60;i++){\n  if(await page.getByRole('dialog').count()===0&&await\
        \ page.locator('[data-composer-input][contenteditable=\"true\"]').first().isVisible())break;\n  const cont=page.getByRole('button',{name:'Continue',exact:true}),later=page.getByRole('button',{name:'Configure\
        \ later',exact:true}),key=page.getByRole('button',{name:'Add API Key',exact:true});\n  if(await cont.isVisible())await\
        \ cont.click();else if(await later.isVisible())await later.click();else if(await key.isVisible())await key.click();\n\
        \  await page.waitForTimeout(500);\n }\n phase='workspace-composer';const input=page.locator('[data-composer-input][contenteditable=\"\
        true\"]').first();await input.waitFor({state:'visible',timeout:30000});await input.fill('Unsubmitted workspace verification');if((await\
        \ input.textContent())!=='Unsubmitted workspace verification')throw Error('Composer edit failed');await input.fill('');if((await\
        \ input.textContent()).trim()!=='')throw Error('Composer draft not cleared');if(pageErrors)throw Error('Frontend exceptions\
        \ after workspace interaction');\n if(!fs.statSync(path.join(fixture,'deepseek-harness','default-workspace')).isDirectory())throw\
        \ Error('Isolated workspace not created');\n if(await page.getByRole('alert').filter({hasText:'Unable to create default\
        \ workspace'}).count())throw Error('Isolated default workspace failed');\n phase='check-auth-redirect';const clean=new\
        \ URL(page.url());if(clean.search||clean.hash)throw Error('Authentication URL not scrubbed');phase='screenshot';await\
        \ page.screenshot({path:path.join(report,`startup-${trial}.png`),fullPage:true});ui='passed-native-Chrome';}\n evidence.push({trial,entry:windows?'direct\
        \ EXE with no arguments from unrelated working directory':'explicit web CLI',browserHandoff:windows?'native ShellExecuteExW\
        \ success observed; UI separately verified in Chrome':'not tested --no-open',httpStatus:200,assetCount:assets.length,ui,visibleTextLength,workspaceDocuments:'isolated\
        \ explicit CI fixture; default OS detection not asserted',workspace:platform==='linux-arm64'?'not-browser-tested':'isolated-default-created-composer-editable'});\n\
        \ }catch(e){if(lastPage){try{diagnostics.body=scrub((await lastPage.locator('body').innerText()).slice(0,4000));diagnostics.controls=await\

name: Build official Electron Desktop packages
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/desktop-build.yml
permissions:
  contents: read
concurrency:
  group: deepseek-desktop
  cancel-in-progress: false
env:
  SOURCE_SHA: bb8e649df3c976c9cd965037593f353009992ae3
  DSH_TELEMETRY_DISABLED: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: win-x64
          runner: windows-2022
        - target: mac-arm64
          runner: macos-latest
        - target: mac-x64
          runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      DESKTOP_TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        repository: shiguredo/deepseek-harness
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.19.0
    - uses: actions/setup-python@v6.3.0
      with:
        python-version: '3.12'
    - uses: pnpm/action-setup@v5.0.0
      with:
        version: 11.28.5
    - name: Verify source and install locked build dependencies
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        pnpm install --frozen-lockfile

        python -m pip install --disable-pip-version-check pefile==2024.8.26

        '
    - name: Select licensed signed Windows release CRT
      if: runner.os == 'Windows'
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

        $vs=& $vswhere -latest -products * -version ''[17.0,18.0)'' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath

        if(-not $vs){throw ''Licensed VS2022 C++ tools missing''}

        $crt=Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName
        ''x64\Microsoft.VC143.CRT'' } | Where-Object { Test-Path $_ } | Select-Object -First 1

        if(-not $crt){throw ''VS release redistributable CRT missing''}

        Get-ChildItem (Split-Path (Split-Path $crt)) -Recurse -Filter ''*.dll'' | Where-Object { $_.Directory.Name -eq ''Microsoft.VC143.CRT''
        -and $_.FullName -notmatch ''debug_nonredist'' } | ForEach-Object { $sig=Get-AuthenticodeSignature $_.FullName; if($sig.Status
        -ne ''Valid'' -or $sig.SignerCertificate.Subject -notmatch ''Microsoft''){throw ''CRT signature invalid''} }

        "DSH_CRT_SOURCE=$crt" >> $env:GITHUB_ENV

        '
    - name: Apply isolated unsigned packaging and app-local CRT changes
      shell: bash
      run: "cat > bundle-crt.py <<'PYCRT'\n\"\"\"Copy unmodified licensed VS release CRT beside matching native consumers\
        \ before sealing.\"\"\"\nimport os,sys,pathlib,shutil,hashlib,json\nimport pefile\nroot=pathlib.Path(sys.argv[1]).resolve();source=pathlib.Path(os.environ['DSH_CRT_SOURCE']).resolve()\n\
        assert source.name=='Microsoft.VC143.CRT' and source.parent.name=='x64' and 'Redist' in source.parts and 'debug_nonredist'\
        \ not in str(source).lower()\nsources={arch:source.parent.parent/arch/source.name for arch in ('x64','x86','arm64')}\n\
        machines={0x8664:'x64',0x14c:'x86',0xaa64:'arm64'}\nfiles={arch:sorted(folder.glob('*.dll')) for arch,folder in sources.items()}\n\
        names={p.name.lower() for group in files.values() for p in group};assert files['x64']\nconsumers=[];destinations={}\n\
        for file in list(root.rglob('*')):\n if not file.is_file() or file.suffix.lower() not in ('.exe','.dll','.node','.pyd'):continue\n\
        \ try:pe=pefile.PE(str(file),fast_load=True)\n except pefile.PEFormatError:raise RuntimeError('Invalid native payload:\
        \ '+str(file.relative_to(root)))\n machine=pe.FILE_HEADER.Machine\n pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT'],pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_DELAY_IMPORT']])\n\
        \ deps=sorted({e.dll.decode('ascii').lower() for key in ('DIRECTORY_ENTRY_IMPORT','DIRECTORY_ENTRY_DELAY_IMPORT')\
        \ for e in getattr(pe,key,[])})\n needed=[n for n in deps if n in names];pe.close()\n missing=[n for n in deps if\
        \ n.startswith(('vcruntime140','msvcp140','concrt140','vccorlib140','vcomp140')) and n not in names]\n if missing:raise\
        \ RuntimeError('CRT dependency outside approved release closure: '+str(missing))\n if file.suffix.lower()=='.exe'\
        \ or needed:\n  arch=machines.get(machine)\n  if arch is None or not files.get(arch):raise RuntimeError('Unsupported\
        \ CRT consumer architecture: '+str(file.relative_to(root))+' '+hex(machine))\n  if any(n not in {p.name.lower() for\
        \ p in files[arch]} for n in needed):raise RuntimeError('Architecture-specific CRT dependency missing')\n  if file.parent\
        \ in destinations and destinations[file.parent]!=arch:raise RuntimeError('Mixed architecture CRT directory: '+str(file.parent.relative_to(root)))\n\
        \  destinations[file.parent]=arch;consumers.append({'file':str(file.relative_to(root)),'architecture':arch,'crtImports':needed})\n\
        for destination,arch in destinations.items():\n for file in files[arch]:\n  pe=pefile.PE(str(file),fast_load=True);actual=machines.get(pe.FILE_HEADER.Machine);pe.close()\n\
        \  if actual!=arch:raise RuntimeError('Redistributable machine mismatch: '+file.name)\n  shutil.copy2(file,destination/file.name)\n\
        sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()\nrecord={'source':'Visual Studio licensed GitHub hosted runner\
        \ VC/Redist/MSVC/'+source.parent.parent.name,'redistribution':'https://learn.microsoft.com/en-us/visualstudio/releases/2022/redistribution','files':{arch:{p.name:sha(p)\
        \ for p in group} for arch,group in files.items() if arch in destinations.values()},'consumers':consumers,'destinations':{str(p.relative_to(root)):arch\
        \ for p,arch in destinations.items()}}\n(root/'app-local-crt.json').write_text(json.dumps(record,indent=2))\n(root/'MICROSOFT-CRT-NOTICE.txt').write_text('Microsoft\
        \ Visual C++ release runtime. Copyright Microsoft Corporation. Unmodified REDIST files from licensed Visual Studio\
        \ on GitHub hosted runners.\\nRedistribution conditions: https://learn.microsoft.com/en-us/visualstudio/releases/2022/redistribution\\\
        nMicrosoft components are licensed separately, not under the Harness MIT license. You may use these components only\
        \ as part of this application, must retain notices and must not remove Microsoft trademarks/notices or distribute\
        \ them separately under this application license. Applicable Microsoft software terms remain controlling. No debug\
        \ runtime or System32 files are included.\\n')\nmanifest=root/'runtime.json'\nif manifest.exists():\n value=json.loads(manifest.read_text());value['payloadDigest']=hashlib.sha256((value['payloadDigest']+json.dumps(record['files'],sort_keys=True)).encode()).hexdigest();manifest.write_text(json.dumps(value,indent=2))\n\
        print(json.dumps({'root':root.name,'consumerDirectories':len(destinations),'architectures':sorted(set(destinations.values()))}))\n\
        \nlicense_dir=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'apps/desktop'\nfor name in ('MICROSOFT-CRT-LICENSE.txt','MICROSOFT-CRT-LICENSE.original.docx','MICROSOFT-CRT-LICENSE.source.json'):shutil.copy2(license_dir/name,root/name)\n\
        \nPYCRT\npython - <<'PYPATCH'\nfrom pathlib import Path\n# Apply upstream unsigned local-package semantics consistently\
        \ on Windows, without official update services.\ndef replace(file,old,new):\n p=Path(file);s=p.read_text();assert\
        \ s.count(old)==1,(file,old);p.write_text(s.replace(old,new))\nbase='apps/desktop/scripts/'\nreplace(base+'package-target.ts',\"\
        const environment = target.platform === 'darwin' && invocation.unsigned\",\"const environment = invocation.unsigned\"\
        )\nreplace(base+'desktop-package-environment.mjs',\"if (target.platform !== 'darwin' || !options.unsigned) resolveDesktopPolicyEnvironment(environment)\"\
        ,\"if (!options.unsigned) resolveDesktopPolicyEnvironment(environment)\")\nreplace(base+'electron-builder-config.mjs',\"\
        const policy = packagesMacOS && unsigned ? undefined : resolveDesktopPolicyEnvironment(env)\",\"const policy = unsigned\
        \ ? undefined : resolveDesktopPolicyEnvironment(env)\")\n# No signing credentials, policy endpoints or updater feeds\
        \ are added to unsigned third-party builds.\nfor file,needle,code in [\n ('prepare-runtime.ts',\"  const executable\
        \ = join(BUILD_PATHS.electron\", \"  if (platform === 'win32') execFileSync('python', [join(process.env.GITHUB_WORKSPACE!,\
        \ 'bundle-crt.py'), BUILD_PATHS.electron], { stdio: 'inherit' })\\n\"),\n ('prepare-primary-runtime.ts',\"  if (!options.deferSmoke)\
        \ smokePrimaryRuntime\", \"  if (process.platform === 'win32') execFileSync('python', [join(process.env.GITHUB_WORKSPACE!,\
        \ 'bundle-crt.py'), join(paths.runtime, 'primary-runtime')], { stdio: 'inherit' })\\n\"),\n ('prepare-dsh.ts',\" \
        \   await packagingStep(process.env.DSH_DESKTOP_PACKAGING_RUN_DIR, 'runtime:manifests'\", \"    if (process.platform\
        \ === 'win32') execFileSync('python', [join(process.env.GITHUB_WORKSPACE!, 'bundle-crt.py'), DSH_OUTPUT_ROOT], { stdio:\
        \ 'inherit' })\\n\"),\n]:\n p=Path(base+file);s=p.read_text();assert s.count(needle)==1\n if file in ('prepare-primary-runtime.ts','prepare-dsh.ts'):s=\"\
        import { execFileSync } from 'node:child_process'\\n\"+s\n assert 'execFileSync' in s\n p.write_text(s.replace(needle,code+needle))\n\
        \nreplace(base+'electron-builder-config.mjs',\"    nsis: {\", \"    nsis: {\\n      license: fileURLToPath(new URL('../MICROSOFT-CRT-INSTALLER-LICENSE.txt',\
        \ import.meta.url)),\")\n\n# The pinned snapshot has four stale family versions; preserve official pack guards.\n\
        import json\nexpected={\n 'packages/api/workspace-git':'@deepseek-ai/dsh-api-workspace-git',\n 'packages/client/ui-git-branch':'@deepseek-ai/dsh-client-ui-git-branch',\n\
        \ 'packages/client/locale-ja':'@deepseek-ai/dsh-client-locale-ja',\n 'packages/web/web-search-ollama':'@deepseek-ai/dsh-web-search-ollama',\n\
        }\nversion=json.loads(Path('package.json').read_text())['version'];assert version=='0.2.1-rc.2'\nassert json.loads(Path('apps/desktop/package.json').read_text())['version']==version\n\
        manifests=list(Path('.').glob('packages/*/*/package.json'))+list(Path('.').glob('apps/*/package.json'))\nstale={str(p.parent):p\
        \ for p in manifests if json.loads(p.read_text()).get('name','').startswith('@deepseek-ai/') and json.loads(p.read_text()).get('version')!=version}\n\
        assert set(stale)==set(expected),stale\nfor directory,p in stale.items():\n value=json.loads(p.read_text());assert\
        \ value['name']==expected[directory] and value['version']=='0.2.1-alpha.5'\n text=p.read_text();assert text.count('\"\
        version\": \"0.2.1-alpha.5\"')==1\n p.write_text(text.replace('\"version\": \"0.2.1-alpha.5\"','\"version\": \"'+version+'\"\
        '))\n\nPYPATCH\npnpm install --frozen-lockfile\ngit diff -- apps/desktop packages/api/workspace-git/package.json packages/client/ui-git-branch/package.json\
        \ packages/client/locale-ja/package.json packages/web/web-search-ollama/package.json > desktop-downstream.patch\n\
        python - <<'PYLICENSE'\nimport base64,pathlib\nfiles={'MICROSOFT-CRT-LICENSE.txt': '',\
        \ 'MICROSOFT-CRT-LICENSE.original.docx': '',\
        \ 'MICROSOFT-CRT-LICENSE.source.json': ''}\n\
        for name,data in files.items():pathlib.Path('apps/desktop',name).write_bytes(base64.b64decode(data))\np=pathlib.Path('apps/desktop/MICROSOFT-CRT-LICENSE.txt');pathlib.Path('apps/desktop/MICROSOFT-CRT-INSTALLER-LICENSE.txt').write_text('The\
        \ following terms apply ONLY to bundled Microsoft Visual C++ Runtime components. Other components retain their own\
        \ open-source licenses and are not relicensed by this page.\\n\\n'+p.read_text(),encoding='utf-8')\n\nPYLICENSE\n\
        cat > monitor-office-crt.ps1 <<'PSMON'\nparam(\n  [Parameter(Mandatory=$true)][string]$BuildRoot,\n  [Parameter(Mandatory=$true)][string]$Output,\n\
        \  [Parameter(Mandatory=$true)][string]$StopMarker,\n  [int]$MaxSeconds = 7200\n)\n$ErrorActionPreference = 'Stop'\n\
        $root = [IO.Path]::GetFullPath($BuildRoot).TrimEnd('\\') + '\\'\n$outputPath = [IO.Path]::GetFullPath($Output)\n$stopPath\
        \ = [IO.Path]::GetFullPath($StopMarker)\nif (Test-Path -LiteralPath $outputPath) { throw 'Refusing to reuse Office\
        \ CRT monitor output' }\nif (Test-Path -LiteralPath $stopPath) { throw 'Office CRT stop marker already exists' }\n\
        [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($outputPath)) | Out-Null\n$writer = [IO.StreamWriter]::new($outputPath,\
        \ $false, [Text.UTF8Encoding]::new($false))\n$writer.AutoFlush = $true\n$seen = @{}\n$timer = [Diagnostics.Stopwatch]::StartNew()\n\
        function Record($record) { $writer.WriteLine(($record | ConvertTo-Json -Depth 6 -Compress)) }\ntry {\n  Record @{\
        \ kind='start'; buildRoot=$root; utc=[DateTime]::UtcNow.ToString('o') }\n  while (-not (Test-Path -LiteralPath $stopPath))\
        \ {\n    if ($timer.Elapsed.TotalSeconds -ge $MaxSeconds) { throw 'Office CRT monitor timed out without stop marker'\
        \ }\n    foreach ($process in @(Get-Process -Name 'libreoffice-kit' -ErrorAction SilentlyContinue)) {\n      $exe\
        \ = $null\n      try {\n        $exe = [IO.Path]::GetFullPath($process.Path)\n        if (-not $exe.StartsWith($root,\
        \ [StringComparison]::OrdinalIgnoreCase)) { continue }\n        $modules = @($process.Modules | Where-Object {\n \
        \         $_.ModuleName -match '^(vcruntime140[^\\\\/]*|msvcp140[^\\\\/]*|concrt140)\\.dll$'\n        } | ForEach-Object\
        \ { @{ name=$_.ModuleName; path=[IO.Path]::GetFullPath($_.FileName) } })\n        if ($modules.Count -eq 0) { continue\
        \ }\n        $key = [string]$process.Id + '|' + $exe + '|' + (($modules | Sort-Object path | ForEach-Object {$_.path})\
        \ -join '|')\n        if (-not $seen.ContainsKey($key)) {\n          $seen[$key] = $true\n          Record @{ kind='observation';\
        \ pid=$process.Id; executable=$exe; modules=$modules; utc=[DateTime]::UtcNow.ToString('o') }\n        }\n      } catch\
        \ {\n        # Processes can exit between enumeration and module inspection. Do not invent observations.\n       \
        \ if ($exe -and $exe.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) {\n          $key = 'error|' + [string]$process.Id\
        \ + '|' + $_.Exception.GetType().FullName\n          if (-not $seen.ContainsKey($key)) {\n            $seen[$key]\
        \ = $true\n            Record @{ kind='sampling-error'; pid=$process.Id; executable=$exe; errorType=$_.Exception.GetType().FullName\
        \ }\n          }\n        }\n      }\n    }\n    Start-Sleep -Milliseconds 100\n  }\n  Record @{ kind='stop'; reason='marker';\
        \ utc=[DateTime]::UtcNow.ToString('o') }\n} finally { $writer.Dispose() }\n\nPSMON\ncat > assert-office-crt.py <<'PYMON'\n\
        \"\"\"Validate observed Office helper module paths, never infer success from silence.\"\"\"\nimport json\nimport ntpath\n\
        import re\nimport sys\nfrom pathlib import Path\n\nrecords = [json.loads(line) for line in Path(sys.argv[1]).read_text(encoding='utf-8-sig').splitlines()\
        \ if line.strip()]\nassert records and records[0].get('kind') == 'start', 'Office CRT monitor did not start'\nassert\
        \ records[-1].get('kind') == 'stop' and records[-1].get('reason') == 'marker', 'Office CRT monitor did not finish\
        \ normally'\nroot = ntpath.normcase(ntpath.normpath(records[0]['buildRoot']))\nobservations = [r for r in records\
        \ if r.get('kind') == 'observation']\nassert observations, 'No Office helper CRT modules observed; sampling is inconclusive,\
        \ not a pass'\nmodule_paths = set()\nexecutables = set()\nfor record in observations:\n    exe = ntpath.normcase(ntpath.normpath(record['executable']))\n\
        \    assert ntpath.commonpath([root, exe]) == root, 'Office helper outside scoped build root'\n    assert ntpath.basename(exe)\
        \ == 'libreoffice-kit.exe', 'Unexpected observed executable'\n    assert record['modules'], 'Observation has no CRT\
        \ module'\n    executables.add(exe)\n    for module in record['modules']:\n        name = module['name'].lower()\n\
        \        assert re.fullmatch(r'(?:vcruntime140[^\\\\/]*|msvcp140[^\\\\/]*|concrt140)\\.dll', name), 'Unexpected module\
        \ family'\n        loaded = ntpath.normcase(ntpath.normpath(module['path']))\n        assert ntpath.basename(loaded)\
        \ == name, 'Module name/path disagreement'\n        assert ntpath.dirname(loaded) == ntpath.dirname(exe), f'Office\
        \ CRT not helper-local: {name}'\n        module_paths.add(loaded)\nprint(json.dumps({'officeHelperCrt': 'observed-app-local',\
        \ 'helperLocations': len(executables),\n                  'moduleLocations': len(module_paths), 'observations': len(observations),\n\
        \                  'scope': 'observed helper processes only; not clean-machine certification'}))\n\nPYMON\n"
    - name: Observe actual Office helper CRT loads
      if: runner.os == 'Windows'
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        $root=Join-Path $PWD ''apps\desktop\.desktop-build''

        $out=Join-Path $PWD ''desktop-qa-results\office-crt.jsonl''

        $stop=Join-Path $PWD ''office-crt.stop''

        $script=Join-Path $PWD ''monitor-office-crt.ps1''

        $args=@(''-NoProfile'',''-NonInteractive'',''-File'',"`"$script`"",''-BuildRoot'',"`"$root`"",''-Output'',"`"$out`"",''-StopMarker'',"`"$stop`"")

        $p=Start-Process powershell.exe -ArgumentList $args -PassThru -WindowStyle Hidden

        $p.Id | Set-Content office-crt.pid

        '
    - name: Build official Electron installer and qualify bundled runtimes
      shell: bash
      run: 'pnpm --dir apps/desktop run package -- "${{ matrix.target }}" --unsigned

        '
    - name: Require observed Office CRT loads from app-local copies
      if: always() && runner.os == 'Windows'
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        New-Item office-crt.stop -ItemType File -Force | Out-Null

        if(Test-Path office-crt.pid){Wait-Process -Id ([int](Get-Content office-crt.pid)) -Timeout 60 -ErrorAction SilentlyContinue}

        python assert-office-crt.py desktop-qa-results/office-crt.jsonl

        if($LASTEXITCODE -ne 0){throw ''Office CRT provenance not verified''}

        '
    - name: Prepare native desktop interaction tests
      shell: bash
      run: "npm install --prefix \"$RUNNER_TEMP/desktop-qa-tools\" --ignore-scripts --no-audit --no-fund playwright@1.61.1\n\
        cat > desktop-qa.cjs <<'JS'\n#!/usr/bin/env node\n'use strict';\n// Native packaged-app QA, never WebUI/SEA validation.\
        \ Run on native target runner.\n// node desktop-qa.cjs <packaged-executable> <report-directory>\n// Requires playwright\
        \ in this script's resolution path (or NODE_PATH). No browser download required.\nconst fs = require('node:fs');\n\
        const path = require('node:path');\nconst os = require('node:os');\nconst crypto = require('node:crypto');\nconst\
        \ assert = require('node:assert/strict');\nconst { execFileSync } = require('node:child_process');\nconst { _electron\
        \ } = require('playwright');\nconst executable = path.resolve(process.argv[2] || '');\nconst output = path.resolve(process.argv[3]\
        \ || 'desktop-qa-results');\nif (!process.argv[2] || !fs.statSync(executable).isFile()) throw Error('Pass actual packaged\
        \ desktop executable');\nif (!['win32', 'darwin'].includes(process.platform)) throw Error('Native desktop QA supports\
        \ Windows/macOS only; Linux is not upstream desktop support');\nfs.mkdirSync(output, { recursive: true });\nconst\
        \ root = fs.mkdtempSync(path.join(os.tmpdir(), 'dsh-desktop-gui-qa-'));\nconst home = path.join(root, 'home');\nconst\
        \ userData = path.join(root, 'electron-user-data');\nconst dshHome = path.join(root, 'dsh-home');\nfor (const p of\
        \ [home, userData, dshHome, path.join(root, 'appdata'), path.join(root, 'localappdata')]) fs.mkdirSync(p, { recursive:\
        \ true });\nconst env = {};\n// Explicit allowlist: do not pass provider credentials, CI tokens, NODE_OPTIONS or Electron\
        \ Node mode.\nfor (const [key, value] of Object.entries(process.env)) {\n  if (/^(SystemRoot|WINDIR|COMSPEC|PATHEXT|TEMP|TMP|TMPDIR|LANG|LC_ALL|LC_CTYPE|TZ|DISPLAY|WAYLAND_DISPLAY|XDG_RUNTIME_DIR|DBUS_SESSION_BUS_ADDRESS|SystemDrive|PROCESSOR_ARCHITECTURE|NUMBER_OF_PROCESSORS)$/i.test(key)\
        \ && value) env[key] = value;\n}\nObject.assign(env, {\n  HOME: home, USERPROFILE: home, APPDATA: path.join(root,\
        \ 'appdata'), LOCALAPPDATA: path.join(root, 'localappdata'),\n  DSH_HOME: dshHome, DSH_TELEMETRY_DISABLED: '1', DSH_TELEMETRY_MODE:\
        \ 'DISABLED',\n  PATH: process.platform === 'win32' ? `${process.env.SystemRoot}\\\\System32;${process.env.SystemRoot}`\
        \ : '/usr/bin:/bin:/usr/sbin:/sbin',\n});\nconst report = {\n  schemaVersion: 1, startedAt: new Date().toISOString(),\
        \ platform: process.platform, architecture: process.arch,\n  executableSha256: crypto.createHash('sha256').update(fs.readFileSync(executable)).digest('hex'),\n\
        \  passed: false, tests: [], limitations: [\n    'Not a pristine OS: native runner may have system runtime libraries\
        \ installed.',\n    'Electron-session network requests are blocked after automation connects; Host subprocess networking\
        \ is not firewalled.',\n    'No provider login or paid inference is tested.',\n    'Storage restart check covers renderer\
        \ localStorage; it does not claim unsent conversation draft persistence.',\n    'NSIS installation/uninstallation\
        \ is a separate test, not established by this executable launch.',\n  ],\n};\nlet app;\nlet launchNumber = 0;\nlet\
        \ previewAcknowledged = false;\nlet previewAcknowledgedOnFirstLaunch = false;\nconst sleep = ms => new Promise(r =>\
        \ setTimeout(r, ms));\nconst canonical = p => process.platform === 'win32' ? path.resolve(p).toLowerCase() : path.resolve(p);\n\
        function record(name, details = {}) { report.tests.push({ name, passed: true, ...details }); }\nasync function until(fn,\
        \ description, timeout = 120000) {\n  const deadline = Date.now() + timeout;\n  while (Date.now() < deadline) { const\
        \ value = await fn(); if (value) return value; await sleep(250); }\n  throw Error(`Timeout: ${description}`);\n}\n\
        async function launch() {\n  launchNumber++;\n  app = await _electron.launch({ executablePath: executable, args: [`--user-data-dir=${userData}`,\
        \ '--lang=en-US'], env, timeout: 120000 });\n  const identity = await app.evaluate(({ app }) => ({ packaged: app.isPackaged,\
        \ name: app.getName(), version: app.getVersion(), execPath: process.execPath, userData: app.getPath('userData'), nodeMode:\
        \ process.env.ELECTRON_RUN_AS_NODE || '', home: process.env.DSH_HOME }));\n  assert.equal(identity.packaged, true,\
        \ 'Must launch packaged Electron app, not development shell');\n  assert.match(identity.name, /deepseek|dsh-desktop/i,\
        \ 'Unexpected desktop app identity');\n  assert.equal(canonical(identity.execPath), canonical(executable), 'Wrong\
        \ executable');\n  assert.equal(canonical(identity.userData), canonical(userData), 'userData isolation failed');\n\
        \  assert.equal(canonical(identity.home), canonical(dshHome), 'DSH_HOME isolation failed');\n  assert.equal(identity.nodeMode,\
        \ '', 'Electron must not run as Node');\n  await app.evaluate(({ session }) => {\n    session.defaultSession.webRequest.onBeforeRequest((details,\
        \ callback) => {\n      let allowed = false;\n      try { const u = new URL(details.url); allowed = ['file:', 'dsh-app:',\
        \ 'devtools:', 'data:', 'blob:'].includes(u.protocol) || (['http:', 'https:', 'ws:', 'wss:'].includes(u.protocol)\
        \ && ['127.0.0.1', 'localhost', '[::1]'].includes(u.hostname)); } catch {}\n      callback({ cancel: !allowed });\n\
        \    });\n  });\n  record('packaged-native-identity', { name: identity.name, version: identity.version });\n  return\
        \ identity;\n}\nasync function workspace() {\n  let clickedKey = false, clickedSkip = false;\n  let firstWorkspaceSeenAt\
        \ = 0;\n  return until(async () => {\n    for (const page of app.windows()) {\n      if (page.isClosed()) continue;\n\
        \      // Welcome is a real shipped local document. Never enter or synthesize credentials.\n      if (/\\/welcome\\\
        .html(?:$|[?#])/.test(page.url())) {\n        if (!clickedKey && await page.locator('#api-key').isVisible().catch(()\
        \ => false)) { await page.locator('#api-key').click(); clickedKey = true; }\n        if (!clickedSkip && await page.locator('#skip-key').isVisible().catch(()\
        \ => false)) { await page.locator('#skip-key').click(); clickedSkip = true; }\n      }\n      if (page.url().startsWith('dsh-app://app/'))\
        \ {\n        if (!firstWorkspaceSeenAt) firstWorkspaceSeenAt = Date.now();\n        const notice = page.getByRole('dialog').filter({\
        \ has: page.getByRole('heading', { name: /^(Preview Notice|\u9884\u89C8\u7248\u8BF4\u660E)$/ }) });\n        if (await\
        \ notice.isVisible().catch(() => false)) {\n          assert.ok(!(launchNumber > 1 && previewAcknowledged), 'Preview\
        \ Notice acknowledgement did not persist across restart');\n          await notice.getByRole('button', { name: /^(Continue|\u7EE7\
        \u7EED)$/ }).click();\n          await notice.waitFor({ state: 'hidden', timeout: 30000 });\n          previewAcknowledged\
        \ = true;\n          if (launchNumber === 1) previewAcknowledgedOnFirstLaunch = true;\n          record('preview-notice-acknowledged',\
        \ { launch: launchNumber });\n        }\n        if (Date.now() - firstWorkspaceSeenAt < 1500) continue;\n       \
        \ if (await page.evaluate(() => Boolean(document.getElementById('root')?.inert))) continue;\n        const editor\
        \ = page.locator('[data-composer-input][contenteditable=\"true\"]:visible');\n        if (await editor.count() ===\
        \ 1) {\n          const browserWindow = await app.browserWindow(page);\n          const visible = await browserWindow.evaluate(window\
        \ => window.isVisible());\n          if (visible && await editor.isEditable()) { record('native-workspace-visible',\
        \ { protocol: 'dsh-app:', skippedOnboarding: clickedSkip }); return page; }\n        }\n      }\n    }\n    return\
        \ undefined;\n  }, 'visible native dsh-app workspace and single editable composer');\n}\nasync function editAndClear(page,\
        \ index) {\n  const editor = page.locator('[data-composer-input][contenteditable=\"true\"]:visible');\n  const text\
        \ = `Desktop QA ${index} \u65E5\u672C\u8A9E input only`;\n  await editor.click();\n  await page.keyboard.press('ControlOrMeta+A');\n\
        \  await page.keyboard.type(text);\n  assert.equal((await editor.innerText()).trim(), text, 'Composer did not reflect\
        \ typed text');\n  await page.screenshot({ path: path.join(output, `desktop-${index}-composer.png`) });\n  await editor.click();\n\
        \  await page.keyboard.press('ControlOrMeta+A');\n  await page.keyboard.press('Backspace');\n  await until(async ()\
        \ => (await editor.innerText()).trim() === '', 'composer clears with native select-all/backspace', 10000);\n  record('composer-edit-clear',\
        \ { launch: index });\n}\nfunction captureCRT(pid, index) {\n  if (process.platform !== 'win32') return;\n  // Read\
        \ only this app's process tree; do not enumerate/serialize unrelated command lines.\n  const ps = `$ErrorActionPreference='Stop';\
        \ $rootPid=${pid}; $all=@(Get-CimInstance Win32_Process); $ids=[System.Collections.Generic.HashSet[int]]::new(); [void]$ids.Add($rootPid);\
        \ do { $changed=$false; foreach($p in $all){ if($ids.Contains([int]$p.ParentProcessId) -and $ids.Add([int]$p.ProcessId)){\
        \ $changed=$true } } } while($changed); $rows=@(); foreach($id in $ids){ try { $p=Get-Process -Id $id -ErrorAction\
        \ Stop; foreach($m in $p.Modules){ if($m.ModuleName -match '^(msvcp140.*|vcruntime140.*|concrt140)\\\\.dll$'){ $rows\
        \ += [pscustomobject]@{pid=$id;name=$m.ModuleName;file=$m.FileName} } } } catch { throw \"Cannot inspect own application\
        \ PID $id modules\" } }; ConvertTo-Json -InputObject @($rows) -Compress`;\n  const stdout = execFileSync(path.join(process.env.SystemRoot,\
        \ 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe'), ['-NoProfile', '-NonInteractive', '-Command', ps], {\
        \ encoding: 'utf8', timeout: 30000 });\n  const modules = JSON.parse(stdout.trim() || '[]');\n  const appRoot = path.dirname(executable);\n\
        \  for (const module of modules) {\n    const rel = path.relative(canonical(appRoot), canonical(module.file));\n \
        \   assert.ok(rel && !rel.startsWith('..') && !path.isAbsolute(rel), `CRT dependency loaded outside bundled app tree:\
        \ ${module.name}`);\n    module.file = rel; // Do not publish absolute machine/user paths.\n  }\n  record('observed-crt-app-local',\
        \ { launch: index, modules, qualification: modules.length ? 'observed modules all app-local' : 'no matching CRT module\
        \ loaded; not proof of dependency absence' });\n}\nasync function close() { if (app) { const current = app; await\
        \ current.close(); app = undefined; } }\n(async () => {\n  try {\n    await launch();\n    let page = await workspace();\n\
        \    await editAndClear(page, 1);\n    const marker = crypto.randomUUID();\n    await page.evaluate(value => localStorage.setItem('dsh-release-qa-storage-marker',\
        \ value), marker);\n    captureCRT(app.process().pid, 1);\n    await close();\n    await launch();\n    page = await\
        \ workspace();\n    assert.equal(await page.evaluate(() => localStorage.getItem('dsh-release-qa-storage-marker')),\
        \ marker, 'Renderer storage did not survive native app restart');\n    await page.evaluate(() => localStorage.removeItem('dsh-release-qa-storage-marker'));\n\
        \    record('same-profile-restart-storage');\n    if (previewAcknowledgedOnFirstLaunch) record('preview-notice-acknowledgement-persisted');\n\
        \    await editAndClear(page, 2);\n    captureCRT(app.process().pid, 2);\n    await close();\n    report.passed =\
        \ true;\n  } catch (error) {\n    // Do not dump arbitrary app logs or URLs containing tokens. Screenshots contain\
        \ synthetic QA only.\n    report.error = String(error.message || error).replaceAll(root, '<isolated-qa-root>').replaceAll(executable,\
        \ '<packaged-executable>');\n    process.exitCode = 1;\n    try { await close(); } catch { report.cleanupError = 'Application\
        \ failed graceful close; runner must terminate only this QA process tree.'; }\n  } finally {\n    report.completedAt\
        \ = new Date().toISOString();\n    fs.writeFileSync(path.join(output, 'desktop-qa.json'), JSON.stringify(report, null,\
        \ 2) + '\\n');\n    // Keep isolated profile local for diagnosis; NEVER upload it (may contain generated local auth/session\
        \ state).\n    console.log(JSON.stringify({ passed: report.passed, tests: report.tests.length, report: path.join(output,\
        \ 'desktop-qa.json') }));\n  }\n})();\n\nJS\n"
    - name: Install exact Windows EXE, launch native UI twice and uninstall
      if: runner.os == 'Windows'
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\n$art=Join-Path $PWD 'apps\\desktop\\.desktop-build\\targets\\win-x64\\unsigned-artifacts'\n\
        $installer=@(Get-ChildItem $art -File -Filter '*.exe');if($installer.Count -ne 1){throw 'Expected exact NSIS installer'}\n\
        $install=Join-Path $env:RUNNER_TEMP 'Desktop QA \u65E5\u672C\u8A9E\\DeepSeek Harness'\n$p=Start-Process -FilePath\
        \ $installer[0].FullName -ArgumentList @('/S',\"/D=$install\") -Wait -PassThru\nif($p.ExitCode -ne 0){throw 'Installer\
        \ failed'}\n$exe=Join-Path $install 'DeepSeek Harness.exe';if(-not(Test-Path $exe)){throw 'Installed executable absent'}\n\
        $env:NODE_PATH=Join-Path $env:RUNNER_TEMP 'desktop-qa-tools\\node_modules'\nnode desktop-qa.cjs $exe desktop-qa-results\n\
        if($LASTEXITCODE -ne 0){throw 'Native Desktop UI QA failed'}\n$uninstaller=@(Get-ChildItem $install -File -Filter\
        \ '*Uninstall*.exe');if($uninstaller.Count -ne 1){throw 'Uninstaller absent'}\n$p=Start-Process -FilePath $uninstaller[0].FullName\
        \ -ArgumentList '/S' -Wait -PassThru\nif($p.ExitCode -ne 0){throw 'Uninstall failed'}\nfor($i=0;$i -lt 60 -and (Test-Path\
        \ $exe);$i++){Start-Sleep -Seconds 1}\nif(Test-Path $exe){throw 'Uninstall did not remove application'}\n'{\"installedExactNSIS\"\
        :true,\"nativeUi\":true,\"uninstalled\":true,\"pristineWindows\":false}' | Set-Content desktop-qa-results\\installer-qa.json\n"
    - name: Mount exact macOS DMG and launch copied Desktop twice
      if: runner.os == 'macOS'
      shell: bash
      run: "set -euo pipefail\nart=\"apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts\"\nmount=\"\
        $RUNNER_TEMP/desktop-dmg\"\nmkdir -p \"$mount\" \"$RUNNER_TEMP/Desktop QA \u65E5\u672C\u8A9E\"\ndmg=$(find \"$art\"\
        \ -maxdepth 1 -name '*.dmg' -print)\ntest -f \"$dmg\"\nhdiutil attach \"$dmg\" -nobrowse -readonly -mountpoint \"\
        $mount\"\nditto \"$mount/DeepSeek Harness.app\" \"$RUNNER_TEMP/Desktop QA \u65E5\u672C\u8A9E/DeepSeek Harness.app\"\
        \nhdiutil detach \"$mount\"\nNODE_PATH=\"$RUNNER_TEMP/desktop-qa-tools/node_modules\" node desktop-qa.cjs \"$RUNNER_TEMP/Desktop\
        \ QA \u65E5\u672C\u8A9E/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness\" desktop-qa-results\n"
    - name: Stage qualified desktop assets and checksums
      shell: bash
      run: "python - <<'PY'\nimport pathlib,os,shutil,hashlib,json,zipfile\nart=pathlib.Path('apps/desktop/.desktop-build/targets')/os.environ['DESKTOP_TARGET']/'unsigned-artifacts'\n\
        out=pathlib.Path('release-assets');out.mkdir();files=list(art.glob('*.exe' if os.name=='nt' else '*.dmg'));assert\
        \ len(files)==1\nfor p in files:\n dst=out/p.name;shutil.copy2(p,dst);dst.with_name(dst.name+'.sha256').write_text(hashlib.sha256(dst.read_bytes()).hexdigest()+'\
        \  '+dst.name+'\\n')\nreport=pathlib.Path('desktop-qa-results');shutil.copy2('desktop-downstream.patch',report/'desktop-downstream.patch')\n\
        (report/'LIMITATIONS.txt').write_text('Unofficial unsigned Electron Desktop build. Bundled Electron, Node, pnpm, Python\
        \ libraries and Office engine. Windows release CRT is app-local. No login or live inference tested. Native hosted\
        \ runner tests are not pristine OS certification. macOS builds are ad-hoc signed, not notarized. Linux Desktop is\
        \ not supported by this upstream pipeline and is not included. Preserve all bundled licenses/notices.\\n')\nwith zipfile.ZipFile(out/('desktop-'+os.environ['DESKTOP_TARGET']+'-verification.zip'),'w',zipfile.ZIP_DEFLATED)\
        \ as z:\n for p in report.iterdir():\n  if p.is_file():z.write(p,p.name)\nPY\n"
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: desktop-${{ matrix.target }}
        path: release-assets/*
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Retain safe QA diagnosis
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: desktop-diagnostic-${{ matrix.target }}
        path: 'desktop-qa-results/*.json

          desktop-qa-results/*.png

          desktop-downstream.patch'
        if-no-files-found: ignore
        retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        pattern: desktop-*
        path: assets
        merge-multiple: true
    - name: Verify and publish qualified official Desktop packages
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: 'set -euo pipefail

        cd assets

        for checksum in *.sha256; do sha256sum -c "$checksum"; done

        test "$(find . -maxdepth 1 -name ''*.sha256'' | wc -l)" -eq 3

        tag="desktop-0.2.1-rc.2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        printf ''%s

        '' ''Unofficial unsigned official Electron Desktop builds: Windows x64 NSIS installer, macOS ARM64/x64 DMG. Bundled
        Electron, Node/pnpm, Python libraries, Office engine and app-local Windows release CRT. Keep included licenses and
        notices. Native UI/renderer/restart and official runtime/Office tests passed; hosted runners are not pristine-machine
        certification. No live model credentials tested. macOS is ad-hoc signed, not notarized; never disable OS protections.
        Linux desktop is unsupported by this upstream build path and is not included. See verification ZIPs.'' > "$RUNNER_TEMP/desktop-release-notes.txt"

        gh release create "$tag" ./* --repo "$GH_REPO" --target "$GITHUB_SHA" --title ''DeepSeek Harness 0.2.1-rc.2 Electron
        Desktop'' --notes-file "$RUNNER_TEMP/desktop-release-notes.txt" --prerelease

        gh release view "$tag" --repo "$GH_REPO" --json url,assets > "$RUNNER_TEMP/desktop-published.json"

        python -c ''import json,os;x=json.load(open(os.environ["RUNNER_TEMP"]+"/desktop-published.json"));assert len(x["assets"])==9
        and all(a["size"]>0 for a in x["assets"]);print(x["url"])''

        '

        \  assert.equal(canonical(identity.home), canonical(dshHome), 'DSH_HOME isolation failed');\n  assert.equal(identity.nodeMode,\
        \ '', 'Electron must not run as Node');\n  await app.evaluate(({ session }) => {\n    session.defaultSession.webRequest.onBeforeRequest((details,\
        \ callback) => {\n      let allowed = false;\n      try { const u = new URL(details.url); allowed = ['file:', 'dsh-app:',\
        \ 'devtools:', 'data:', 'blob:'].includes(u.protocol) || (['http:', 'https:', 'ws:', 'wss:'].includes(u.protocol)\
        \ && ['127.0.0.1', 'localhost', '[::1]'].includes(u.hostname)); } catch {}\n      callback({ cancel: !allowed });\n\
        \    });\n  });\n  record('packaged-native-identity', { name: identity.name, version: identity.version });\n  return\
        \ identity;\n}\nasync function workspace() {\n  let clickedKey = false, clickedSkip = false;\n  let firstWorkspaceSeenAt\
        \ = 0;\n  return until(async () => {\n    for (const page of app.windows()) {\n      if (page.isClosed()) continue;\n\
        \      // Welcome is a real shipped local document. Never enter or synthesize credentials.\n      if (/\\/welcome\\\
        .html(?:$|[?#])/.test(page.url())) {\n        if (!clickedKey && await page.locator('#api-key').isVisible().catch(()\
        \ => false)) { await page.locator('#api-key').click(); clickedKey = true; }\n        if (!clickedSkip && await page.locator('#skip-key').isVisible().catch(()\
        \ => false)) { await page.locator('#skip-key').click(); clickedSkip = true; }\n      }\n      if (page.url().startsWith('dsh-app://app/'))\
        \ {\n        if (!firstWorkspaceSeenAt) firstWorkspaceSeenAt = Date.now();\n        const notice = page.getByRole('dialog').filter({\
        \ has: page.getByRole('heading', { name: /^(Preview Notice|\u9884\u89C8\u7248\u8BF4\u660E)$/ }) });\n        if (await\
        \ notice.isVisible().catch(() => false)) {\n          assert.ok(!(launchNumber > 1 && previewAcknowledged), 'Preview\
        \ Notice acknowledgement did not persist across restart');\n          await notice.getByRole('button', { name: /^(Continue|\u7EE7\
        \u7EED)$/ }).click();\n          await notice.waitFor({ state: 'hidden', timeout: 30000 });\n          previewAcknowledged\
        \ = true;\n          if (launchNumber === 1) previewAcknowledgedOnFirstLaunch = true;\n          record('preview-notice-acknowledged',\
        \ { launch: launchNumber });\n        }\n        if (Date.now() - firstWorkspaceSeenAt < 1500) continue;\n       \
        \ if (await page.evaluate(() => Boolean(document.getElementById('root')?.inert))) continue;\n        const editor\
        \ = page.locator('[data-composer-input][contenteditable=\"true\"]:visible');\n        if (await editor.count() ===\
        \ 1) {\n          const browserWindow = await app.browserWindow(page);\n          const visible = await browserWindow.evaluate(window\
        \ => window.isVisible());\n          if (visible && await editor.isEditable()) { record('native-workspace-visible',\

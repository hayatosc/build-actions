        \ true, 'Must launch packaged Electron app, not development shell');\n  assert.match(identity.name, /deepseek|dsh-desktop/i,\
        \ 'Unexpected desktop app identity');\n  assert.equal(canonical(identity.execPath), canonical(executable), 'Wrong\

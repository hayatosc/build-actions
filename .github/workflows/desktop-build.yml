    - name: Install exact Windows EXE, launch native UI twice and uninstall
      if: runner.os == 'Windows'
      shell: pwsh
      run: "$ErrorActionPreference='Stop'\n$art=Join-Path $PWD 'apps\\desktop\\.desktop-build\\targets\\win-x64\\unsigned-artifacts'\n\
        $installer=@(Get-ChildItem $art -File -Filter '*.exe');if($installer.Count -ne 1){throw 'Expected exact NSIS installer'}\n\
        $install=Join-Path $env:RUNNER_TEMP 'Desktop QA \u65E5\u672C\u8A9E\\DeepSeek Harness'\n$p=Start-Process -FilePath\
        \ $installer[0].FullName -ArgumentList @('/S',\"/D=$install\") -Wait -PassThru\nif($p.ExitCode -ne 0){throw 'Installer\
        \ failed'}\n$exe=Join-Path $install 'DeepSeek Harness.exe';if(-not(Test-Path $exe)){throw 'Installed executable absent'}\n\
        $env:NODE_PATH=Join-Path $env:RUNNER_TEMP 'desktop-qa-tools\\node_modules'\nnode desktop-qa.cjs $exe desktop-qa-results\n\
        if($LASTEXITCODE -ne 0){throw 'Native Desktop UI QA failed'}\n$uninstaller=@(Get-ChildItem $install -File -Filter\
        \ '*Uninstall*.exe');if($uninstaller.Count -ne 1){throw 'Uninstaller absent'}\n$p=Start-Process -FilePath $uninstaller[0].FullName\
        \ -ArgumentList '/S' -Wait -PassThru\nif($p.ExitCode -ne 0){throw 'Uninstall failed'}\nfor($i=0;$i -lt 60 -and (Test-Path\
        \ $exe);$i++){Start-Sleep -Seconds 1}\nif(Test-Path $exe){throw 'Uninstall did not remove application'}\n'{\"installedExactNSIS\"\
        :true,\"nativeUi\":true,\"uninstalled\":true,\"pristineWindows\":false}' | Set-Content desktop-qa-results\\installer-qa.json\n"
    - name: Mount exact macOS DMG and launch copied Desktop twice
      if: runner.os == 'macOS'
      shell: bash
      run: "set -euo pipefail\nart=\"apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts\"\nmount=\"\
        $RUNNER_TEMP/desktop-dmg\"\nmkdir -p \"$mount\" \"$RUNNER_TEMP/Desktop QA \u65E5\u672C\u8A9E\"\ndmg=$(find \"$art\"\
        \ -maxdepth 1 -name '*.dmg' -print)\ntest -f \"$dmg\"\nhdiutil attach \"$dmg\" -nobrowse -readonly -mountpoint \"\
        $mount\"\nditto \"$mount/DeepSeek Harness.app\" \"$RUNNER_TEMP/Desktop QA \u65E5\u672C\u8A9E/DeepSeek Harness.app\"\
        \nhdiutil detach \"$mount\"\nNODE_PATH=\"$RUNNER_TEMP/desktop-qa-tools/node_modules\" node desktop-qa.cjs \"$RUNNER_TEMP/Desktop\
        \ QA \u65E5\u672C\u8A9E/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness\" desktop-qa-results\n"
    - name: Stage qualified desktop assets and checksums
      shell: bash
      run: "python - <<'PY'\nimport pathlib,os,shutil,hashlib,json,zipfile\nart=pathlib.Path('apps/desktop/.desktop-build/targets')/os.environ['DESKTOP_TARGET']/'unsigned-artifacts'\n\
        out=pathlib.Path('release-assets');out.mkdir();files=list(art.glob('*.exe' if os.name=='nt' else '*.dmg'));assert\
        \ len(files)==1\nfor p in files:\n dst=out/p.name;shutil.copy2(p,dst);dst.with_name(dst.name+'.sha256').write_text(hashlib.sha256(dst.read_bytes()).hexdigest()+'\
        \  '+dst.name+'\\n')\nreport=pathlib.Path('desktop-qa-results');shutil.copy2('desktop-downstream.patch',report/'desktop-downstream.patch')\n\
        (report/'LIMITATIONS.txt').write_text('Unofficial unsigned Electron Desktop build. Bundled Electron, Node, pnpm, Python\
        \ libraries and Office engine. Windows release CRT is app-local. No login or live inference tested. Native hosted\
        \ runner tests are not pristine OS certification. macOS builds are ad-hoc signed, not notarized. Linux Desktop is\
        \ not supported by this upstream pipeline and is not included. Preserve all bundled licenses/notices.\\n')\nwith zipfile.ZipFile(out/('desktop-'+os.environ['DESKTOP_TARGET']+'-verification.zip'),'w',zipfile.ZIP_DEFLATED)\
        \ as z:\n for p in report.iterdir():\n  if p.is_file():z.write(p,p.name)\nPY\n"
    - uses: actions/upload-artifact@v7.0.1
      with:
        name: desktop-${{ matrix.target }}
        path: release-assets/*
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Retain safe QA diagnosis
      if: failure()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: desktop-diagnostic-${{ matrix.target }}
        path: 'desktop-qa-results/*.json

          desktop-qa-results/*.png

          desktop-downstream.patch'
        if-no-files-found: ignore
        retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8.0.1
      with:
        pattern: desktop-*
        path: assets
        merge-multiple: true
    - name: Verify and publish qualified official Desktop packages
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: 'set -euo pipefail

        cd assets

        for checksum in *.sha256; do sha256sum -c "$checksum"; done

        test "$(find . -maxdepth 1 -name ''*.sha256'' | wc -l)" -eq 3

        tag="desktop-0.2.1-rc.2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        printf ''%s

        '' ''Unofficial unsigned official Electron Desktop builds: Windows x64 NSIS installer, macOS ARM64/x64 DMG. Bundled
        Electron, Node/pnpm, Python libraries, Office engine and app-local Windows release CRT. Keep included licenses and
        notices. Native UI/renderer/restart and official runtime/Office tests passed; hosted runners are not pristine-machine
        certification. No live model credentials tested. macOS is ad-hoc signed, not notarized; never disable OS protections.
        Linux desktop is unsupported by this upstream build path and is not included. See verification ZIPs.'' > "$RUNNER_TEMP/desktop-release-notes.txt"

        gh release create "$tag" ./* --repo "$GH_REPO" --target "$GITHUB_SHA" --title ''DeepSeek Harness 0.2.1-rc.2 Electron
        Desktop'' --notes-file "$RUNNER_TEMP/desktop-release-notes.txt" --prerelease

        gh release view "$tag" --repo "$GH_REPO" --json url,assets > "$RUNNER_TEMP/desktop-published.json"

        python -c ''import json,os;x=json.load(open(os.environ["RUNNER_TEMP"]+"/desktop-published.json"));assert len(x["assets"])==9
        and all(a["size"]>0 for a in x["assets"]);print(x["url"])''

        '

name: Build official Electron Desktop packages
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - .github/workflows/desktop-build.yml
permissions:
  contents: read
concurrency:
  group: deepseek-desktop
  cancel-in-progress: false
env:
  SOURCE_SHA: bb8e649df3c976c9cd965037593f353009992ae3
  DSH_TELEMETRY_DISABLED: '1'
  PYTHONUTF8: '1'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: win-x64
          runner: windows-2022
        - target: mac-arm64
          runner: macos-latest
        - target: mac-x64
          runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      DESKTOP_TARGET: ${{ matrix.target }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        repository: shiguredo/deepseek-harness
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: false
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: 24.19.0
    - uses: actions/setup-python@v6.3.0
      with:
        python-version: '3.12'
    - uses: pnpm/action-setup@v5.0.0
      with:
        version: 11.28.5
    - name: Verify source and install locked build dependencies
      shell: bash
      run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        pnpm install --frozen-lockfile

        python -m pip install --disable-pip-version-check pefile==2024.8.26

        '
    - name: Select licensed signed Windows release CRT
      if: runner.os == 'Windows'
      shell: pwsh
      run: '$ErrorActionPreference=''Stop''

        $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

        $vs=& $vswhere -latest -products * -version ''[17.0,18.0)'' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64
        -property installationPath

        if(-not $vs){throw ''Licensed VS2022 C++ tools missing''}

        $crt=Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName
        ''x64\Microsoft.VC143.CRT'' } | Where-Object { Test-Path $_ } | Select-Object -First 1

        if(-not $crt){throw ''VS release redistributable CRT missing''}

        Get-ChildItem (Split-Path (Split-Path $crt)) -Recurse -Filter ''*.dll'' | Where-Object { $_.Directory.Name -eq ''Microsoft.VC143.CRT''
        -and $_.FullName -notmatch ''debug_nonredist'' } | ForEach-Object { $sig=Get-AuthenticodeSignature $_.FullName; if($sig.Status
        -ne ''Valid'' -or $sig.SignerCertificate.Subject -notmatch ''Microsoft''){throw ''CRT signature invalid''} }

        "DSH_CRT_SOURCE=$crt" >> $env:GITHUB_ENV

        '
    - name: Apply isolated unsigned packaging and app-local CRT changes
      shell: bash
      run: "cat > bundle-crt.py <<'PYCRT'\n\"\"\"Copy unmodified licensed VS release CRT beside matching native consumers\
        \ before sealing.\"\"\"\nimport os,sys,pathlib,shutil,hashlib,json,subprocess\nimport pefile\nroot=pathlib.Path(sys.argv[1]).resolve();source=pathlib.Path(os.environ['DSH_CRT_SOURCE']).resolve()\n\
        assert source.name=='Microsoft.VC143.CRT' and source.parent.name=='x64' and 'Redist' in source.parts and 'debug_nonredist'\
        \ not in str(source).lower()\nsources={arch:source.parent.parent/arch/source.name for arch in ('x64','x86','arm64')}\n\
        machines={0x8664:'x64',0x14c:'x86',0xaa64:'arm64'}\nfiles={arch:sorted(folder.glob('*.dll')) for arch,folder in sources.items()}\n\
        names={p.name.lower() for group in files.values() for p in group};assert files['x64']\nconsumers=[];destinations={};static_helpers=[];non_windows_assets=[]\n\
        non_windows={'dependencies/pnpm/dist/node_modules/@reflink/reflink-darwin-arm64/reflink.darwin-arm64.node': {'sha256':\
        \ '0cf6caf1b125009161c98e7fb39d996da26548b09e7b17d7688357f9c3b97a02', 'headerHex': 'cffaedfe0c00000100000000060000000f000000e00700008500900000000000',\
        \ 'size': 404184, 'cpuType': 16777228}, 'dependencies/pnpm/dist/node_modules/@reflink/reflink-darwin-x64/reflink.darwin-x64.node':\
        \ {'sha256': 'e107629c8000ad509954bdc84e4bb8fec38453c210d8a4370a9fadb28aff5b97', 'headerHex': 'cffaedfe0700000103000000060000000d000000600700008500900000000000',\
        \ 'size': 417392, 'cpuType': 16777223}}\nfastlist={\n 'fastlist-0.3.0-x64.exe':('d1a71f9ac1728082c1b276392725c3e010b98714888579b99152e401abedbf11',0x8664),\n\
        \ 'fastlist-0.3.0-x86.exe':('017411f3b0b5c0402cc3b2cb87c32c6fc71abd82e5b17ea6108990096c75a65d',0x14c),\n}\nwheel_receipt=None;wheel_consumers={}\n\
        workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])\nif (root/'dependencies/python/Lib/site-packages/numpy.libs/msvcp140-a4c2229bdc2a2a630acdc095b4d86008.dll').is_file():\n\
        \ subprocess.run([sys.executable,str(workspace/'verify-wheel-crt.py'),str(root)],check=True,timeout=240)\n wheel_receipt=json.loads((root/'verified-wheel-crt.json').read_text())\n\
        \ wheel_consumers={c['path']:c for c in wheel_receipt['allowedConsumers']}\ndistlib_receipt=None;distlib_paths=set()\n\
        if (root/'dependencies/python/Lib/site-packages/pip/_vendor/distlib/t64.exe').is_file():\n subprocess.run([sys.executable,str(workspace/'verify-distlib.py'),str(root)],check=True,timeout=120)\n\
        \ distlib_receipt=json.loads((root/'verified-distlib.json').read_text())\n distlib_paths={c['path'] for c in distlib_receipt['launchers']}\n\
        venv_receipt=None;venv_paths=set()\nif (root/'dependencies/python/Lib/venv/scripts/nt/python.exe').is_file():\n subprocess.run([sys.executable,str(workspace/'verify-venv-launchers.py'),str(root)],check=True,timeout=120)\n\
        \ venv_receipt=json.loads((root/'verified-venv.json').read_text())\n venv_paths={c['path'] for c in venv_receipt['templates']}\n\
        for file in list(root.rglob('*')):\n if not file.is_file() or file.suffix.lower() not in ('.exe','.dll','.node','.pyd'):continue\n\
        \ relative=file.relative_to(root).as_posix()\n if relative in distlib_paths or relative in venv_paths:continue\n if\
        \ relative in non_windows:\n  expected=non_windows[relative];data=file.read_bytes()\n  assert len(data)==expected['size']\
        \ and data[:32].hex()==expected['headerHex'] and hashlib.sha256(data).hexdigest()==expected['sha256'],'Pinned non-Windows\
        \ payload changed'\n  non_windows_assets.append({'file':relative,**expected,'format':'Mach-O64-LE','source':'https://registry.npmjs.org/pnpm/-/pnpm-11.28.5.tgz'})\n\
        \  continue\n try:pe=pefile.PE(str(file),fast_load=True)\n except pefile.PEFormatError:raise RuntimeError('Invalid\
        \ native payload: '+str(file.relative_to(root)))\n machine=pe.FILE_HEADER.Machine\n pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_IMPORT'],pefile.DIRECTORY_ENTRY['IMAGE_DIRECTORY_ENTRY_DELAY_IMPORT']])\n\
        \ deps=sorted({e.dll.decode('ascii').lower() for key in ('DIRECTORY_ENTRY_IMPORT','DIRECTORY_ENTRY_DELAY_IMPORT')\
        \ for e in getattr(pe,key,[])})\n delay=bool(getattr(pe,'DIRECTORY_ENTRY_DELAY_IMPORT',[]))\n needed=[n for n in deps\
        \ if n in names];pe.close()\n if file.name in fastlist and file.relative_to(root).parent.as_posix()=='dependencies/pnpm/dist/vendor':\n\
        \  expected_hash,expected_machine=fastlist[file.name]\n  actual_hash=hashlib.sha256(file.read_bytes()).hexdigest()\n\
        \  assert actual_hash==expected_hash and machine==expected_machine and deps==['kernel32.dll'] and not delay,'Pinned\
        \ static helper changed'\n  result=subprocess.run([str(file)],capture_output=True,timeout=30,check=True)\n  assert\
        \ result.stdout.strip(),'Static process helper smoke produced no output'\n  static_helpers.append({'file':file.relative_to(root).as_posix(),'sha256':actual_hash,'architecture':machines[machine],'imports':deps,'nativeSmoke':True,'source':'https://github.com/MarkTiedemann/fastlist/tree/v0.3.0','runtime':'statically\
        \ linked; no imported CRT'})\n  continue\n verified_alias=wheel_receipt is not None and relative in wheel_consumers\
        \ and machine==0x8664 and hashlib.sha256(file.read_bytes()).hexdigest()==wheel_consumers[relative]['sha256']\n missing=[n\
        \ for n in deps if n.startswith(('vcruntime140','msvcp140','concrt140','vccorlib140','vcomp140')) and n not in names\
        \ and not (verified_alias and n==wheel_receipt['alias'])]\n if missing:\n  subprocess.run([sys.executable,str(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'diagnose-wheel-crt.py'),str(root),missing[0]],check=True,timeout=180)\n\
        \  raise RuntimeError('CRT dependency outside approved release closure: '+file.relative_to(root).as_posix()+' '+str(missing))\n\
        \ if file.suffix.lower()=='.exe' or needed:\n  arch=machines.get(machine)\n  if arch is None or not files.get(arch):raise\
        \ RuntimeError('Unsupported CRT consumer architecture: '+str(file.relative_to(root))+' '+hex(machine))\n  if any(n\
        \ not in {p.name.lower() for p in files[arch]} for n in needed):raise RuntimeError('Architecture-specific CRT dependency\
        \ missing')\n  if file.parent in destinations and destinations[file.parent]!=arch:raise RuntimeError('Mixed architecture\
        \ CRT directory: '+str(file.parent.relative_to(root)))\n  destinations[file.parent]=arch;consumers.append({'file':str(file.relative_to(root)),'architecture':arch,'crtImports':needed})\n\
        source_machines=[]\nfor source_arch,group in files.items():\n for source_file in group:\n  pe=pefile.PE(str(source_file),fast_load=True);source_machine=pe.FILE_HEADER.Machine;pe.close()\n\
        \  source_machines.append({'architecture':source_arch,'file':source_file.name,'machine':hex(source_machine),'sha256':hashlib.sha256(source_file.read_bytes()).hexdigest()})\n\
        evidence=workspace/'desktop-qa-results';evidence.mkdir(exist_ok=True)\n(evidence/'crt-source-machines.json').write_text(json.dumps({'sources':source_machines,'destinations':{p.relative_to(root).as_posix():a\
        \ for p,a in destinations.items()}},indent=2))\narm64_receipt=None\nif 'arm64' in destinations.values():\n arm_dirs={p.relative_to(root).as_posix()\
        \ for p,a in destinations.items() if a=='arm64'}\n expected_arm_dir='dependencies/pnpm/dist/node_modules/@reflink/reflink-win32-arm64-msvc'\
        \ if (root/'dependencies/pnpm').is_dir() else 'node_modules/node-pty/third_party/conpty/1.25.260303002/win10-arm64'\n\
        \ if arm_dirs!={expected_arm_dir}:raise RuntimeError('Unexpected ARM64 payload destinations')\n subprocess.run([sys.executable,str(workspace/'verify-arm64-crt.py'),str(root),str(sources['arm64'])],check=True,timeout=120)\n\
        \ arm64_receipt=json.loads((root/'verified-arm64-crt.json').read_text())\n if arm64_receipt.get('verified') is not\
        \ True:raise RuntimeError('ARM64 closure not verified')\n excluded=sources['arm64']/arm64_receipt['excludedFile']\n\
        \ if hashlib.sha256(excluded.read_bytes()).hexdigest()!=arm64_receipt['excludedSha256']:raise RuntimeError('Companion\
        \ changed after verification')\n files['arm64']=[p for p in files['arm64'] if p!=excluded]\n (evidence/('verified-arm64-crt-'+root.name+'.json')).write_text(json.dumps(arm64_receipt,indent=2))\n\
        for destination,arch in destinations.items():\n for file in files[arch]:\n  pe=pefile.PE(str(file),fast_load=True);source_machine=pe.FILE_HEADER.Machine;actual=machines.get(source_machine);pe.close()\n\
        \  if actual!=arch:\n   pe=pefile.PE(str(file));load=getattr(getattr(pe,'DIRECTORY_ENTRY_LOAD_CONFIG',None),'struct',None)\n\
        \   details={'architecture':arch,'file':file.name,'machine':hex(source_machine),'sha256':hashlib.sha256(file.read_bytes()).hexdigest(),'loadConfig':load.dump()\
        \ if load else None};pe.close()\n   vs=next((p for p in source.parents if (p/'VC/Tools/MSVC').is_dir()),None)\n  \
        \ if vs is not None:\n    dumpbins=sorted((vs/'VC/Tools/MSVC').glob('*/bin/Hostx64/x64/dumpbin.exe'),reverse=True)\n\
        \    if dumpbins:\n     headers=subprocess.run([str(dumpbins[0]),'/headers',str(file)],capture_output=True,text=True,timeout=30,check=True).stdout\n\
        \     details['dumpbinHeaders']=[line for line in headers.splitlines() if str(file).lower() not in line.lower()]\n\
        \   (evidence/'crt-source-mismatch.json').write_text(json.dumps(details,indent=2))\n   raise RuntimeError('Redistributable\
        \ machine mismatch: '+arch+'/'+file.name+' machine='+hex(source_machine))\n  shutil.copy2(file,destination/file.name)\n\
        if wheel_receipt is not None:\n python=root/'dependencies/python/python.exe';assert python.is_file()\n env={k:v for\
        \ k,v in os.environ.items() if k.upper() in ('SYSTEMROOT','WINDIR','TEMP','TMP','COMSPEC','PATHEXT')}\n env['PATH']=os.environ['SystemRoot']+'\\\
        \\System32;'+os.environ['SystemRoot']\n result=subprocess.run([str(python),'-I','-B',str(workspace/'smoke-wheel-crt.py'),str(root)],capture_output=True,text=True,env=env,timeout=120,check=True)\n\
        \ proof=json.loads(result.stdout);assert proof['passed'] is True\n evidence=workspace/'desktop-qa-results';evidence.mkdir(exist_ok=True)\n\
        \ (evidence/'wheel-crt-runtime.json').write_text(json.dumps(proof,indent=2))\n (evidence/'verified-wheel-crt.json').write_text(json.dumps(wheel_receipt,indent=2))\n\
        if distlib_receipt is not None:\n python=root/'dependencies/python/python.exe';assert python.is_file()\n env={k:v\
        \ for k,v in os.environ.items() if k.upper() in ('SYSTEMROOT','WINDIR','TEMP','TMP','COMSPEC','PATHEXT')}\n env['PATH']=os.environ['SystemRoot']+'\\\
        \\System32;'+os.environ['SystemRoot']\n result=subprocess.run([str(python),'-I','-B',str(workspace/'smoke-distlib.py'),str(root)],capture_output=True,text=True,env=env,timeout=120,check=True)\n\
        \ proof=json.loads(result.stdout);assert proof['passed'] is True\n evidence=workspace/'desktop-qa-results';evidence.mkdir(exist_ok=True)\n\
        \ (evidence/'distlib-runtime.json').write_text(json.dumps(proof,indent=2))\n (evidence/'verified-distlib.json').write_text(json.dumps(distlib_receipt,indent=2))\n\
        if venv_receipt is not None:\n python=root/'dependencies/python/python.exe';assert python.is_file()\n env={k:v for\
        \ k,v in os.environ.items() if k.upper() in ('SYSTEMROOT','WINDIR','TEMP','TMP','COMSPEC','PATHEXT')}\n env['PATH']=os.environ['SystemRoot']+'\\\
        \\System32;'+os.environ['SystemRoot']\n result=subprocess.run([str(python),'-I','-B',str(workspace/'smoke-venv-launchers.py'),str(root)],capture_output=True,text=True,env=env,timeout=210,check=True)\n\
        \ proof=json.loads(result.stdout);assert proof['passed'] is True\n evidence=workspace/'desktop-qa-results';evidence.mkdir(exist_ok=True)\n\
        \ (evidence/'venv-runtime.json').write_text(json.dumps(proof,indent=2))\n (evidence/'verified-venv.json').write_text(json.dumps(venv_receipt,indent=2))\n\
        sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()\nrecord={'source':'Visual Studio licensed GitHub hosted runner\
        \ VC/Redist/MSVC/'+source.parent.parent.name,'redistribution':'https://learn.microsoft.com/en-us/visualstudio/releases/2022/redistribution','files':{arch:{p.name:sha(p)\
        \ for p in group} for arch,group in files.items() if arch in destinations.values()},'consumers':consumers,'staticHelpers':static_helpers,'distlibTemplates':distlib_receipt,'venvTemplates':venv_receipt,'arm64Closure':arm64_receipt,'nonWindowsAssets':non_windows_assets,'destinations':{str(p.relative_to(root)):arch\
        \ for p,arch in destinations.items()}}\n(root/'app-local-crt.json').write_text(json.dumps(record,indent=2))\n(root/'MICROSOFT-CRT-NOTICE.txt').write_text('Microsoft\
        \ Visual C++ release runtime. Copyright Microsoft Corporation. Unmodified REDIST files from licensed Visual Studio\
        \ on GitHub hosted runners.\\nRedistribution conditions: https://learn.microsoft.com/en-us/visualstudio/releases/2022/redistribution\\\
        nMicrosoft components are licensed separately, not under the Harness MIT license. You may use these components only\
        \ as part of this application, must retain notices and must not remove Microsoft trademarks/notices or distribute\
        \ them separately under this application license. Applicable Microsoft software terms remain controlling. No debug\
        \ runtime or System32 files are included.\\n')\nmanifest=root/'runtime.json'\nif manifest.exists():\n value=json.loads(manifest.read_text());value['payloadDigest']=hashlib.sha256((value['payloadDigest']+json.dumps(record['files'],sort_keys=True)).encode()).hexdigest();manifest.write_text(json.dumps(value,indent=2))\n\
        print(json.dumps({'root':root.name,'consumerDirectories':len(destinations),'architectures':sorted(set(destinations.values()))}))\n\
        \nlicense_dir=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'apps/desktop'\nfor name in ('MICROSOFT-CRT-LICENSE.txt','MICROSOFT-CRT-LICENSE.original.docx','MICROSOFT-CRT-LICENSE.source.json'):shutil.copy2(license_dir/name,root/name)\n\
        \nPYCRT\npython - <<'PYPATCH'\nfrom pathlib import Path\n# Apply upstream unsigned local-package semantics consistently\
        \ on Windows, without official update services.\ndef replace(file,old,new):\n p=Path(file);s=p.read_text();assert\
        \ s.count(old)==1,(file,old);p.write_text(s.replace(old,new))\nbase='apps/desktop/scripts/'\nreplace(base+'package-target.ts',\"\
        const environment = target.platform === 'darwin' && invocation.unsigned\",\"const environment = invocation.unsigned\"\
        )\nreplace(base+'desktop-package-environment.mjs',\"if (target.platform !== 'darwin' || !options.unsigned) resolveDesktopPolicyEnvironment(environment)\"\
        ,\"if (!options.unsigned) resolveDesktopPolicyEnvironment(environment)\")\nreplace(base+'electron-builder-config.mjs',\"\
        const policy = packagesMacOS && unsigned ? undefined : resolveDesktopPolicyEnvironment(env)\",\"const policy = unsigned\
        \ ? undefined : resolveDesktopPolicyEnvironment(env)\")\n# No signing credentials, policy endpoints or updater feeds\
        \ are added to unsigned third-party builds.\nfor file,needle,code in [\n ('prepare-runtime.ts',\"  const executable\
        \ = join(BUILD_PATHS.electron\", \"  if (platform === 'win32') execFileSync('python', [join(process.env.GITHUB_WORKSPACE!,\
        \ 'bundle-crt.py'), BUILD_PATHS.electron], { stdio: 'inherit' })\\n\"),\n ('prepare-primary-runtime.ts',\"  if (!options.deferSmoke)\
        \ smokePrimaryRuntime\", \"  if (process.platform === 'win32') execFileSync('python', [join(process.env.GITHUB_WORKSPACE!,\
        \ 'bundle-crt.py'), join(paths.runtime, 'primary-runtime')], { stdio: 'inherit' })\\n\"),\n ('prepare-dsh.ts',\" \
        \   await packagingStep(process.env.DSH_DESKTOP_PACKAGING_RUN_DIR, 'runtime:manifests'\", \"    if (process.platform\
        \ === 'win32') execFileSync('python', [join(process.env.GITHUB_WORKSPACE!, 'bundle-crt.py'), DSH_OUTPUT_ROOT], { stdio:\
        \ 'inherit' })\\n\"),\n]:\n p=Path(base+file);s=p.read_text();assert s.count(needle)==1\n if file in ('prepare-primary-runtime.ts','prepare-dsh.ts'):s=\"\
        import { execFileSync } from 'node:child_process'\\n\"+s\n assert 'execFileSync' in s\n p.write_text(s.replace(needle,code+needle))\n\
        \nreplace(base+'electron-builder-config.mjs',\"    nsis: {\", \"    nsis: {\\n      license: fileURLToPath(new URL('../MICROSOFT-CRT-INSTALLER-LICENSE.txt',\
        \ import.meta.url)),\")\n\n# The pinned snapshot has four stale family versions; preserve official pack guards.\n\
        import json\nexpected={\n 'packages/api/workspace-git':'@deepseek-ai/dsh-api-workspace-git',\n 'packages/client/ui-git-branch':'@deepseek-ai/dsh-client-ui-git-branch',\n\
        \ 'packages/client/locale-ja':'@deepseek-ai/dsh-client-locale-ja',\n 'packages/web/web-search-ollama':'@deepseek-ai/dsh-web-search-ollama',\n\
        }\nversion=json.loads(Path('package.json').read_text())['version'];assert version=='0.2.1-rc.2'\nassert json.loads(Path('apps/desktop/package.json').read_text())['version']==version\n\
        manifests=list(Path('.').glob('packages/*/*/package.json'))+list(Path('.').glob('apps/*/package.json'))\nstale={p.parent.as_posix():p\
        \ for p in manifests if json.loads(p.read_text()).get('name','').startswith('@deepseek-ai/') and json.loads(p.read_text()).get('version')!=version}\n\
        assert set(stale)==set(expected),stale\nfor directory,p in stale.items():\n value=json.loads(p.read_text());assert\
        \ value['name']==expected[directory] and value['version']=='0.2.1-alpha.5'\n text=p.read_text();assert text.count('\"\
        version\": \"0.2.1-alpha.5\"')==1\n p.write_text(text.replace('\"version\": \"0.2.1-alpha.5\"','\"version\": \"'+version+'\"\
        '))\n\n# Retry only transient transport/server failures; retain locked checksum validation unchanged.\nreplace('scripts/primary-runtime/prepare.ts',\n\
        \ \"    const response = await fetch(url, { signal: AbortSignal.timeout(timeout) })\",\n \"\"\"    let response: Response\
        \ | undefined\n    for (let attempt = 0; attempt < 3; attempt++) {\n      try {\n        response = await fetch(url,\
        \ { signal: AbortSignal.timeout(timeout) })\n        if ((response.status === 429 || (response.status >= 500 && response.status\
        \ < 600)) && attempt < 2) {\n          await response.body?.cancel()\n          await new Promise(resolve => setTimeout(resolve,\
        \ 2000 * (attempt + 1)))\n          continue\n        }\n        break\n      } catch (error) {\n        if (attempt\
        \ === 2) throw error\n        await new Promise(resolve => setTimeout(resolve, 2000 * (attempt + 1)))\n      }\n \
        \   }\n    if (!response) throw new Error('primary runtime download: no response')\"\"\")\n\n# Match the existing\
        \ release tarball helper: avoid GNU tar's drive-colon remote syntax.\nreplace(base+'prepare-package-set.ts', \"import\
        \ { basename, join, resolve } from 'node:path'\", \"import { basename, dirname, join, resolve } from 'node:path'\"\
        )\nreplace(base+'prepare-package-set.ts', \"capture('tar', ['-xOzf', tarball, 'package/package.json'])\", \"capture('tar',\
        \ ['-xOzf', basename(tarball), 'package/package.json'], { cwd: dirname(tarball) })\")\n\nPYPATCH\npnpm install --frozen-lockfile\n\
        git diff -- scripts/primary-runtime/prepare.ts apps/desktop packages/api/workspace-git/package.json packages/client/ui-git-branch/package.json\
        \ packages/client/locale-ja/package.json packages/web/web-search-ollama/package.json > desktop-downstream.patch\n\
        python - <<'PYLICENSE'\nimport base64,pathlib\nfiles={'MICROSOFT-CRT-LICENSE.txt': '',\
        \ 'MICROSOFT-CRT-LICENSE.original.docx': '',\
        \ 'MICROSOFT-CRT-LICENSE.source.json': ''}\n\
        for name,data in files.items():pathlib.Path('apps/desktop',name).write_bytes(base64.b64decode(data))\np=pathlib.Path('apps/desktop/MICROSOFT-CRT-LICENSE.txt');pathlib.Path('apps/desktop/MICROSOFT-CRT-INSTALLER-LICENSE.txt').write_text('The\
        \ following terms apply ONLY to bundled Microsoft Visual C++ Runtime components. Other components retain their own\
        \ open-source licenses and are not relicensed by this page.\\n\\n'+p.read_text(),encoding='utf-8')\n\nPYLICENSE\n\

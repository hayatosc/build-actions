        \  report.failureDiagnostics = { launch: launchNumber, pageErrors, windows: [] };\n  if (!app) return;\n  let index\
        \ = 0;\n  for (const page of app.windows()) {\n    const entry = { index: index++, location: safeLocation(page.url()),\
        \ closed: page.isClosed() };\n    report.failureDiagnostics.windows.push(entry);\n    if (entry.closed) continue;\n\
        \    try {\n      const native = await app.browserWindow(page);\n      Object.assign(entry, await native.evaluate(window\
        \ => ({ visible: window.isVisible(), minimized: window.isMinimized(), focused: window.isFocused() })));\n      entry.title\
        \ = safeText(await page.title());\n      entry.dom = await page.evaluate(() => ({ readyState: document.readyState,\

        \          await page.screenshot({ path: path.join(output, entry.screenshot), timeout: 10000, mask: [page.locator('input,\
        \ textarea, [contenteditable], pre, code, canvas, img, svg')] });\n        } finally { await changes.evaluate(changes\
        \ => { for (const [node, text] of changes) node.nodeValue = text; }).catch(() => {}); await changes.dispose(); }\n\
        \      }\n    } catch (error) { entry.diagnosticError = safeText(error.message || error); }\n  }\n}\nasync function\
        \ until(fn, description, timeout = 120000) {\n  const deadline = Date.now() + timeout;\n  while (Date.now() < deadline)\
        \ { const value = await fn(); if (value) return value; await sleep(250); }\n  throw Error(`Timeout: ${description}`);\n\
        }\nasync function launch() {\n  launchNumber++;\n  app = await _electron.launch({ executablePath: executable, args:\
        \ [`--user-data-dir=${userData}`, '--lang=en-US'], env, timeout: 120000 });\n  app.on('window', watchPage);\n  for\
        \ (const page of app.windows()) watchPage(page);\n  const identity = await app.evaluate(({ app }) => ({ packaged:\
        \ app.isPackaged, name: app.getName(), version: app.getVersion(), execPath: process.execPath, userData: app.getPath('userData'),\
